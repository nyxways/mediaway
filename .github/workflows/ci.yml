# CI — mirrors local lefthook pre-push + deny (docs/conventions/hooks.md)
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Separate rust-cache / sccache namespaces — main and PR never share write keys.
  MEDIAWAY_CACHE_NS: ${{ github.event_name == 'pull_request' && 'pr' || 'main' }}

jobs:
  # Whole-workspace policy gate — no Rust toolchain, so it fails fast on
  # every change, before the expensive jobs even start.
  source-length:
    name: source files ≤1000 lines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Source files ≤1000 lines
        shell: bash
        run: |
          set -euo pipefail
          MAX="${MEDIAWAY_MAX_SOURCE_LINES:-1000}"
          fail=0
          while IFS= read -r -d '' f; do
            lines=$(wc -l <"$f" | tr -d '[:space:]')
            if [[ "$lines" =~ ^[0-9]+$ ]] && (( lines > MAX )); then
              echo "❌ $f ($lines lines > $MAX)"
              fail=1
            fi
          done < <(find crates tools -type f \( \
            -name '*.rs' -o -name '*.c' -o -name '*.h' -o \
            -name '*.cc' -o -name '*.cpp' -o -name '*.hpp' -o \
            -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' -o \
            -name '*.go' -o -name '*.zig' \
          \) -not -path '*/vendor/*' -print0 2>/dev/null || true)
          exit "$fail"

  affected:
    name: affected crates
    runs-on: ubuntu-latest
    outputs:
      set: ${{ steps.compute.outputs.set }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      # Dependency-tree reachability (bun tools/scripts/ci-affected.ts):
      # NONE / ALL / space-separated package set. Every rust-consuming job
      # gates on this — docs-only commits skip the expensive matrix.
      - name: Compute affected crates
        id: compute
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [[ "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            echo "set=ALL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$BASE" == origin/* ]]; then
            git fetch --quiet origin "${{ github.base_ref }}"
          fi
          set="$(bun tools/scripts/ci-affected.ts --base "$BASE")"
          echo "set=$set" >> "$GITHUB_OUTPUT"
          echo "affected: $set"

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [affected]
    # NONE ⇒ no Rust workspace files changed — skip the whole job (fmt is
    # workspace-wide and can't differ from main when nothing Rust changed).
    if: ${{ needs.affected.outputs.set != 'NONE' }}
    env:
      AFFECTED: ${{ needs.affected.outputs.set }}
    strategy:
      fail-fast: false
      matrix:
        # Windows first in product order; Linux keeps CI cheap/reliable.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enable sccache (namespaced)
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          # Different SCCACHE_GHA_VERSION ⇒ isolated GHA blob namespace (docs: mozilla/sccache GHA.md)
          echo "SCCACHE_GHA_VERSION=mediaway-${MEDIAWAY_CACHE_NS}-v1" >> "$GITHUB_ENV"

      - name: Install Linux system deps (pipewire camera backend)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libspa-0.2-dev libva-dev

      - name: Cache cargo (registry / git / cleaned target)
        uses: Swatinem/rust-cache@v2
        with:
          # Distinct prefix ⇒ restore-keys cannot cross main ↔ PR.
          prefix-key: mediaway-ci-${{ env.MEDIAWAY_CACHE_NS }}-v1
          key: ${{ matrix.os }}
          cache-on-failure: true
          # Each namespace saves into itself only.
          save-if: true

      - name: Install cargo-nextest (faster parallel test runner)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (affected set)
        if: ${{ env.AFFECTED != 'NONE' && env.AFFECTED != 'ALL' }}
        shell: bash
        run: |
          # shellcheck disable=SC2046
          cargo clippy --all-targets --all-features -p $(echo "$AFFECTED" | sed 's/ / -p /g') -- -D warnings

      - name: cargo clippy (full workspace)
        if: ${{ env.AFFECTED == 'ALL' }}
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo nextest test (affected set)
        if: ${{ env.AFFECTED != 'NONE' && env.AFFECTED != 'ALL' }}
        shell: bash
        run: |
          # shellcheck disable=SC2046
          cargo nextest run --all-features -p $(echo "$AFFECTED" | sed 's/ / -p /g')

      - name: cargo nextest test (full workspace)
        if: ${{ env.AFFECTED == 'ALL' }}
        run: cargo nextest run --workspace --all-features

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    needs: [affected]
    # NONE ⇒ Cargo.lock / manifests untouched ⇒ deny result identical to main.
    if: ${{ needs.affected.outputs.set != 'NONE' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: mediaway-ci-${{ env.MEDIAWAY_CACHE_NS }}-v1
          key: deny-ubuntu
          cache-on-failure: true
          save-if: true

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check advisories licenses bans sources

  wasm:
    name: wasm compile
    runs-on: ubuntu-latest
    needs: [affected]
    if: >-
      ${{ needs.affected.outputs.set == 'ALL' ||
          contains(needs.affected.outputs.set, 'iso-bmff-wasm') ||
          contains(needs.affected.outputs.set, 'mediaway-encoder') ||
          contains(needs.affected.outputs.set, 'mediaway-decoder') ||
          contains(needs.affected.outputs.set, 'mediaway-device') ||
          contains(needs.affected.outputs.set, 'iso-bmff') ||
          contains(needs.affected.outputs.set, 'mediaway-common') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enable sccache (namespaced)
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          # Different SCCACHE_GHA_VERSION ⇒ isolated GHA blob namespace (docs: mozilla/sccache GHA.md)
          echo "SCCACHE_GHA_VERSION=mediaway-${MEDIAWAY_CACHE_NS}-v1" >> "$GITHUB_ENV"

      - name: Build wasm crates
        run: |
          cargo build -p iso-bmff-wasm -p mediaway-encoder -p mediaway-decoder -p mediaway-device \
            --target wasm32-unknown-unknown --release

  e2e-web:
    name: e2e-web (optional)
    runs-on: ubuntu-latest
    needs: [affected, wasm]
    # cascades: skipped when wasm is skipped (job-level if on wasm)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enable sccache (namespaced)
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          # Different SCCACHE_GHA_VERSION ⇒ isolated GHA blob namespace (docs: mozilla/sccache GHA.md)
          echo "SCCACHE_GHA_VERSION=mediaway-${MEDIAWAY_CACHE_NS}-v1" >> "$GITHUB_ENV"

      - name: Install wasm-bindgen-cli (prebuilt binary)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.126

      - name: Install wasm-pack (prebuilt binary)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: oven-sh/setup-bun@v2

      # `playwright install chromium` downloads a ~170 MB browser every run;
      # cache it (keyed on the pinned @playwright/test version in package.json)
      # so warm runs skip the download entirely.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.MEDIAWAY_CACHE_NS }}-${{ hashFiles('tools/e2e-web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ env.MEDIAWAY_CACHE_NS }}-

      - name: Build wasm packages
        working-directory: tools/e2e-web
        run: bun run build:wasm

      # The browser-package fixture serves the @mediaway/browser npm package
      # (dist + wasm pkg) — without this build it 404s and every test on
      # browser-package.html times out.
      - name: Build @mediaway/browser package
        working-directory: bindings/browser/packages/browser
        run: |
          bun install
          bun run build

      - name: Install Playwright + run tests
        working-directory: tools/e2e-web
        run: |
          bun install
          bun run install-browsers
          bun run test
