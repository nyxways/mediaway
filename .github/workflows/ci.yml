# CI — mirrors local lefthook pre-push + deny (docs/conventions/hooks.md)
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Separate rust-cache / sccache namespaces — main and PR never share write keys.
  MEDIAWAY_CACHE_NS: ${{ github.event_name == 'pull_request' && 'pr' || 'main' }}

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows first in product order; Linux keeps CI cheap/reliable.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enable sccache (namespaced)
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          # Different SCCACHE_GHA_VERSION ⇒ isolated GHA blob namespace (docs: mozilla/sccache GHA.md)
          echo "SCCACHE_GHA_VERSION=mediaway-${MEDIAWAY_CACHE_NS}-v1" >> "$GITHUB_ENV"

      - name: Install Linux system deps (pipewire camera backend)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libspa-0.2-dev

      - name: Cache cargo (registry / git / cleaned target)
        uses: Swatinem/rust-cache@v2
        with:
          # Distinct prefix ⇒ restore-keys cannot cross main ↔ PR.
          prefix-key: mediaway-ci-${{ env.MEDIAWAY_CACHE_NS }}-v1
          key: ${{ matrix.os }}
          cache-on-failure: true
          # Each namespace saves into itself only.
          save-if: true

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Source files ≤1000 lines
        shell: bash
        run: |
          set -euo pipefail
          MAX="${MEDIAWAY_MAX_SOURCE_LINES:-1000}"
          fail=0
          while IFS= read -r -d '' f; do
            lines=$(wc -l <"$f" | tr -d '[:space:]')
            if [[ "$lines" =~ ^[0-9]+$ ]] && (( lines > MAX )); then
              echo "❌ $f ($lines lines > $MAX)"
              fail=1
            fi
          done < <(find crates tools -type f \( \
            -name '*.rs' -o -name '*.c' -o -name '*.h' -o \
            -name '*.cc' -o -name '*.cpp' -o -name '*.hpp' -o \
            -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' -o \
            -name '*.go' -o -name '*.zig' \
          \) -not -path '*/vendor/*' -print0 2>/dev/null || true)
          exit "$fail"

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: mediaway-ci-${{ env.MEDIAWAY_CACHE_NS }}-v1
          key: deny-ubuntu
          cache-on-failure: true
          save-if: true

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check advisories licenses bans sources

  wasm:
    name: wasm compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Build wasm crates
        run: |
          cargo build -p iso-bmff-wasm -p mediaway-encoder-web -p mediaway-device-web \
            --target wasm32-unknown-unknown --release

  e2e-web:
    name: e2e-web (optional)
    runs-on: ubuntu-latest
    needs: wasm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - uses: oven-sh/setup-bun@v2

      - name: Build wasm packages
        working-directory: tools/e2e-web
        run: bun run build:wasm

      - name: Install Playwright + run tests
        working-directory: tools/e2e-web
        run: |
          bun install
          bun run install-browsers
          bun run test
