# CI — mirrors local lefthook pre-push + deny (docs/conventions/hooks.md)
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Separate rust-cache / sccache namespaces — main and PR never share write keys.
  MEDIAWAY_CACHE_NS: ${{ github.event_name == 'pull_request' && 'pr' || 'main' }}

jobs:
  # Whole-workspace policy gate — no Rust toolchain, so it fails fast on
  # every change, before the expensive jobs even start.
  source-length:
    name: source files ≤1000 lines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Source files ≤1000 lines
        shell: bash
        run: |
          set -euo pipefail
          MAX="${MEDIAWAY_MAX_SOURCE_LINES:-1000}"
          fail=0
          while IFS= read -r -d '' f; do
            lines=$(wc -l <"$f" | tr -d '[:space:]')
            if [[ "$lines" =~ ^[0-9]+$ ]] && (( lines > MAX )); then
              echo "❌ $f ($lines lines > $MAX)"
              fail=1
            fi
          done < <(find crates tools -type f \( \
            -name '*.rs' -o -name '*.c' -o -name '*.h' -o \
            -name '*.cc' -o -name '*.cpp' -o -name '*.hpp' -o \
            -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' -o \
            -name '*.go' -o -name '*.zig' \
          \) -not -path '*/vendor/*' -print0 2>/dev/null || true)
          exit "$fail"

  affected:
    name: affected crates
    runs-on: ubuntu-latest
    outputs:
      set: ${{ steps.compute.outputs.set }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      # Dependency-tree reachability (bun tools/scripts/ci-affected.ts):
      # NONE / ALL / space-separated package set. Every rust-consuming job
      # gates on this — docs-only commits skip the expensive matrix.
      - name: Compute affected crates
        id: compute
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [[ "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            echo "set=ALL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$BASE" == origin/* ]]; then
            git fetch --quiet origin "${{ github.base_ref }}"
          fi
          set="$(bun tools/scripts/ci-affected.ts --base "$BASE")"
          echo "set=$set" >> "$GITHUB_OUTPUT"
          echo "affected: $set"

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [affected]
    # NONE ⇒ no Rust workspace files changed — skip the whole job (fmt is
    # workspace-wide and can't differ from main when nothing Rust changed).
    # release/* → main PRs are backports of release.yml, which already ran the
    # full test + publish suite — skip CI there too. A skipped required check
    # passes (same mechanism as the NONE skip above).
    if: >-
      ${{ (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/'))
          && needs.affected.outputs.set != 'NONE' }}
    env:
      AFFECTED: ${{ needs.affected.outputs.set }}
    strategy:
      fail-fast: false
      matrix:
        # Windows first in product order; Linux keeps CI cheap/reliable.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enable sccache (namespaced)
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          # Different SCCACHE_GHA_VERSION ⇒ isolated GHA blob namespace (docs: mozilla/sccache GHA.md)
          echo "SCCACHE_GHA_VERSION=mediaway-${MEDIAWAY_CACHE_NS}-v1" >> "$GITHUB_ENV"

      - name: Install Linux system deps (pipewire camera backend)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libspa-0.2-dev libva-dev

      - name: Cache cargo (registry / git / cleaned target)
        uses: Swatinem/rust-cache@v2
        with:
          # Distinct prefix ⇒ restore-keys cannot cross main ↔ PR.
          prefix-key: mediaway-ci-${{ env.MEDIAWAY_CACHE_NS }}-v1
          key: ${{ matrix.os }}
          cache-on-failure: true
          # Each namespace saves into itself only.
          save-if: true

      - name: Install cargo-nextest (faster parallel test runner)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (affected set)
        if: ${{ env.AFFECTED != 'NONE' && env.AFFECTED != 'ALL' }}
        shell: bash
        run: |
          # shellcheck disable=SC2046
          cargo clippy --all-targets --all-features -p $(echo "$AFFECTED" | sed 's/ / -p /g') -- -D warnings

      - name: cargo clippy (full workspace)
        if: ${{ env.AFFECTED == 'ALL' }}
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo nextest test (affected set)
        if: ${{ env.AFFECTED != 'NONE' && env.AFFECTED != 'ALL' }}
        shell: bash
        run: |
          # shellcheck disable=SC2046
          cargo nextest run --all-features -p $(echo "$AFFECTED" | sed 's/ / -p /g')

      - name: cargo nextest test (full workspace)
        if: ${{ env.AFFECTED == 'ALL' }}
        run: cargo nextest run --workspace --all-features

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    needs: [affected]
    # NONE ⇒ Cargo.lock / manifests untouched ⇒ deny result identical to main.
    # release/* → main PRs skip too (release.yml already gated the graph).
    if: >-
      ${{ (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/'))
          && needs.affected.outputs.set != 'NONE' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: mediaway-ci-${{ env.MEDIAWAY_CACHE_NS }}-v1
          key: deny-ubuntu
          cache-on-failure: true
          save-if: true

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check advisories licenses bans sources

  wasm:
    name: wasm compile
    runs-on: ubuntu-latest
    needs: [affected]
    if: >-
      ${{ (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/')) &&
          (needs.affected.outputs.set == 'ALL' ||
          contains(needs.affected.outputs.set, 'iso-bmff-wasm') ||
          contains(needs.affected.outputs.set, 'mediaway-encoder') ||
          contains(needs.affected.outputs.set, 'mediaway-decoder') ||
          contains(needs.affected.outputs.set, 'mediaway-device') ||
          contains(needs.affected.outputs.set, 'iso-bmff') ||
          contains(needs.affected.outputs.set, 'mediaway-common')) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enable sccache (namespaced)
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          # Different SCCACHE_GHA_VERSION ⇒ isolated GHA blob namespace (docs: mozilla/sccache GHA.md)
          echo "SCCACHE_GHA_VERSION=mediaway-${MEDIAWAY_CACHE_NS}-v1" >> "$GITHUB_ENV"

      - name: Build wasm crates
        run: |
          cargo build -p iso-bmff-wasm -p mediaway-encoder -p mediaway-decoder -p mediaway-device \
            --target wasm32-unknown-unknown --release

  android:
    name: android compile (mediaway-encoder, mediaway-device)
    runs-on: ubuntu-latest
    needs: [affected]
    # Compile-only, same accepted shape as the `wasm` job above: this workspace's dev
    # environment cannot run/test an Android target either — see
    # crates/mediaway-encoder/adr/android/0001-ndk-amediacodec-h264-cpu-upload.md and
    # crates/mediaway-device/adr/android/000{1,2,3}-*.md § CI verification plan. The two
    # crates lint at different Android API levels (`-p 21` vs `-p 26`) because
    # mediaway-device::android needs AAudio + the native `Surface` bridge (both API 26+),
    # while mediaway-encoder::android's AMediaCodec usage only needs API 21 — two separately
    # scoped minSdk decisions, not a contradiction.
    if: >-
      ${{ (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/')) &&
          (needs.affected.outputs.set == 'ALL' ||
          contains(needs.affected.outputs.set, 'mediaway-encoder') ||
          contains(needs.affected.outputs.set, 'mediaway-device') ||
          contains(needs.affected.outputs.set, 'mediaway-common')) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android target
        run: rustup target add aarch64-linux-android

      - name: Install Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          # Pinned for reproducibility (not `latest`) — bump deliberately, not silently.
          ndk-version: r27c

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enable sccache (namespaced)
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          # Different SCCACHE_GHA_VERSION ⇒ isolated GHA blob namespace (docs: mozilla/sccache GHA.md)
          echo "SCCACHE_GHA_VERSION=mediaway-${MEDIAWAY_CACHE_NS}-v1" >> "$GITHUB_ENV"

      - name: Lint mediaway-encoder for Android (arm64-v8a, API 21)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a --platform 21 clippy -p mediaway-encoder --all-features --all-targets -- -D warnings

      - name: Lint mediaway-device for Android (arm64-v8a, API 26)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a --platform 26 clippy -p mediaway-device --all-features --all-targets -- -D warnings

  apple-macos:
    name: apple compile (macOS, mediaway-encoder, mediaway-device)
    runs-on: macos-14
    needs: [affected]
    # Compile + lint only, same accepted shape as `wasm`/`android` above: this workspace's dev
    # environment cannot legally cross-compile Apple code at all outside macOS — see
    # crates/mediaway-encoder/adr/apple/0001-videotoolbox-h264-cpu-upload.md and
    # crates/mediaway-device/adr/apple/000{1,2,3}-*.md § CI verification plan. `macos-14` is a
    # pinned image (not `macos-latest`), same reproducibility philosophy as the `android` job's
    # pinned NDK version.
    if: >-
      ${{ (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/')) &&
          (needs.affected.outputs.set == 'ALL' ||
          contains(needs.affected.outputs.set, 'mediaway-encoder') ||
          contains(needs.affected.outputs.set, 'mediaway-device') ||
          contains(needs.affected.outputs.set, 'mediaway-common')) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Lint mediaway-encoder for macOS (native)
        run: |
          cargo clippy -p mediaway-encoder --all-features --all-targets -- -D warnings

      - name: Lint mediaway-device for macOS (native)
        run: |
          cargo clippy -p mediaway-device --all-features --all-targets -- -D warnings

  apple-ios:
    name: apple compile (iOS cross-compile, mediaway-encoder, mediaway-device)
    runs-on: macos-14
    needs: [affected]
    # Compile-only, cross-compiled — no simulator boot, mirroring the `android` job's
    # no-emulator scope discipline. `mediaway-device`'s iOS-only `AppleBroadcastExtensionCapture`
    # (adr/apple/0004) compiles here too — it's ordinary `#[cfg(target_os = "ios")]` Rust code,
    # no extension-specific toolchain needed to compile, only to actually build/ship a real
    # `.appex` target (which this crate cannot do — see that ADR's own CI verification plan).
    if: >-
      ${{ (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/')) &&
          (needs.affected.outputs.set == 'ALL' ||
          contains(needs.affected.outputs.set, 'mediaway-encoder') ||
          contains(needs.affected.outputs.set, 'mediaway-device') ||
          contains(needs.affected.outputs.set, 'mediaway-common')) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add iOS target
        run: rustup target add aarch64-apple-ios

      - name: Lint mediaway-encoder for iOS (cross-compile)
        run: |
          cargo clippy --target aarch64-apple-ios -p mediaway-encoder --all-features --all-targets -- -D warnings

      - name: Lint mediaway-device for iOS (cross-compile)
        run: |
          cargo clippy --target aarch64-apple-ios -p mediaway-device --all-features --all-targets -- -D warnings

  e2e-web:
    name: e2e-web (optional)
    runs-on: ubuntu-latest
    needs: [affected, wasm]
    # cascades: skipped when wasm is skipped (job-level if on wasm)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enable sccache (namespaced)
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          # Different SCCACHE_GHA_VERSION ⇒ isolated GHA blob namespace (docs: mozilla/sccache GHA.md)
          echo "SCCACHE_GHA_VERSION=mediaway-${MEDIAWAY_CACHE_NS}-v1" >> "$GITHUB_ENV"

      - name: Install wasm-bindgen-cli (prebuilt binary)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.126

      - name: Install wasm-pack (prebuilt binary)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: oven-sh/setup-bun@v2

      # `playwright install chromium` downloads a ~170 MB browser every run;
      # cache it (keyed on the pinned @playwright/test version in package.json)
      # so warm runs skip the download entirely.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.MEDIAWAY_CACHE_NS }}-${{ hashFiles('tools/e2e-web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ env.MEDIAWAY_CACHE_NS }}-

      - name: Build wasm packages
        working-directory: tools/e2e-web
        run: bun run build:wasm

      # The browser-package fixture serves the @mediaway/browser npm package
      # (dist + wasm pkg) — without this build it 404s and every test on
      # browser-package.html times out.
      - name: Build @mediaway/browser package
        working-directory: bindings/browser/packages/browser
        run: |
          bun install
          bun run build

      - name: Install Playwright + run tests
        working-directory: tools/e2e-web
        run: |
          bun install
          bun run install-browsers
          bun run test
