# Release: publish every registry package and create the GitHub release.
# Triggered by a push to a release branch (`release` or `release/*`). The
# version is read from `[workspace.package]` in the root Cargo.toml (single
# source of truth) and stamped into the npm / NuGet / PyPI / CPack manifests
# at publish time — bump only the workspace version, never the per-package
# ones by hand.
#
# Manual run: `workflow_dispatch` — pick the release branch as the ref; set
# `dry_run=true` to run the whole pipeline (version checks, crates pre-flight,
# package builds, `npm publish --dry-run`) without publishing anything.
#
# Registry tokens live in repo Actions secrets; set them with
# `bun tools/scripts/release-secrets.ts` (interactive TUI, prints where to get
# each token):
#   NUGET_USER            nuget.org   your nuget.org username (for NuGet/login OIDC)
#   CARGO_REGISTRY_TOKEN  crates.io   https://crates.io/settings/tokens
#   GITHUB_TOKEN          — automatic (creates the v<version> tag + release)
#
# PyPI needs NO token: Trusted Publishing (OIDC) is configured on pypi.org
# for nyxways/mediaway@release.yml (environment: release) — see the pypi job.
#
# crates.io: dependency-ordered publish of the 20-crate set (9 freestanding
# cores + the mediaway-* family incl. avcli/avprobe + vpl-sys +
# mediaway-test-media; rtmp, mediaway-ffi and iso-bmff-wasm stay
# `publish = false`) via tools/scripts/publish-crates.ts.
#
# npm and NuGet need NO long-lived tokens: the @mediaway org uses npm OIDC
# Trusted Publishing (npmjs.com → org Settings → Trusted Publishing), and
# nuget.org uses a Trusted Publishing policy (nuget.org → Trusted Publishing →
# repo nyxways/mediaway, workflow file release.yml). Both authenticate with
# the workflow's id-token (see `permissions`) — npm directly, NuGet via
# NuGet/login@v1, which exchanges it for a 1-hour API key.
#
# Every publishing job runs under the `release` GitHub environment (Settings →
# Environments → release). Protection rules there gate ALL registry publishes;
# registry-side environment restrictions (NuGet policy, npm trusted publisher)
# are set to `release` to match. No rules = jobs run immediately.
#
# Failure semantics: registries are one-shot per version — if a publish fails
# partway, fix and bump the workspace version for the next attempt (or delete
# the half-published packages manually). The GitHub release is created only
# when every registry job succeeded.
name: release

on:
  push:
    branches: ["release", "release/**"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the pipeline (version checks + builds) but publish nothing"
        type: boolean
        default: false
      npm_provenance:
        description: "Publish npm packages with provenance (requires npm trusted publishing on the @mediaway org)"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write # npm provenance (OIDC)
  attestations: write # PyPI PEP 740 provenance (pypa/gh-action-pypi-publish)

# One release at a time per branch; a second push queues instead of cancelling
# an in-flight publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version (workspace Cargo.toml)
        id: extract
        shell: bash
        run: |
          VERSION="$(awk '/^\[workspace\.package\]/{f=1} f && /^version[[:space:]]*=/{sub(/^version[[:space:]]*=[[:space:]]*"/, ""); sub(/".*$/, ""); print; exit}' Cargo.toml)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::invalid workspace version '$VERSION' — expected semver under [workspace.package] in Cargo.toml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Refuse re-releasing an existing version
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::release v$VERSION already exists — bump [workspace.package] version in Cargo.toml"
            exit 1
          fi

      - name: Release branch version must match the workspace version
        # A push to release/vX.Y.Z publishes that exact X.Y.Z — refuse a
        # mismatch (branch says v0.1.1 but Cargo.toml still 0.1.0) instead of
        # silently releasing the wrong version.
        if: ${{ startsWith(github.ref_name, 'release/v') }}
        shell: bash
        run: |
          BRANCH_VERSION="${GITHUB_REF_NAME#release/v}"
          VERSION="${{ steps.extract.outputs.version }}"
          if [[ "$BRANCH_VERSION" != "$VERSION" ]]; then
            echo "::error::branch ${GITHUB_REF_NAME} implies version ${BRANCH_VERSION} but the workspace version is ${VERSION} — bump [workspace.package] version in Cargo.toml on this branch"
            exit 1
          fi

  native-assets:
    name: native assets (win64 DLLs)
    runs-on: windows-latest
    # crates.io publishes first (dependency-ordered, with per-crate
    # verification builds); the native binding build and everything after it
    # waits for that gate so a registry failure aborts the whole pipeline
    # before any binding artifacts are produced.
    needs: [version, crates]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Add windows-gnu target
        shell: bash
        run: rustup target add x86_64-pc-windows-gnu

      # The bindings' verified build is the GNU target (see
      # tools/scripts/copy-native-dlls.ts) — MinGW-w64 provides the linker.
      - uses: msys2/setup-msys2@v2
        with:
          update: false

      - name: Install MinGW-w64 (ucrt)
        shell: msys2 {0}
        run: pacman -S --noconfirm mingw-w64-ucrt-x86_64-gcc

      - name: Put ucrt64 bin on PATH
        shell: bash
        run: echo "C:\msys64\ucrt64\bin" >> "$GITHUB_PATH"

      - uses: oven-sh/setup-bun@v2

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enable sccache (release namespace)
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_VERSION=mediaway-release-v1" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: mediaway-release-v1
          key: native-win64

      - name: Build + stage cdylib
        shell: bash
        run: bun tools/scripts/copy-native-dlls.ts --release --target x86_64-pc-windows-gnu

      # PyPI builds one wheel per platform from a shared bindings/python/
      # mediaway/_native/ dir (see the pypi job) — stage a per-RID copy
      # alongside the real one so that job can select win-x64's lib without
      # colliding with the linux-x64/osx-* copies the other native-assets-*
      # jobs stage the same way.
      - name: Stage python lib for cross-platform artifact merge
        shell: bash
        run: |
          mkdir -p bindings/python/_native-staging/win-x64
          cp bindings/python/mediaway/_native/* bindings/python/_native-staging/win-x64/

      - name: Upload native assets (win-x64)
        uses: actions/upload-artifact@v4
        with:
          name: native-dlls
          path: |
            bindings/nodejs/packages/ffi/native
            bindings/python/mediaway/_native
            bindings/python/_native-staging
            bindings/csharp/runtime/win-x64/native
            bindings/native/runtime/win-x64

  native-assets-linux:
    name: native assets (linux-x64 .so)
    # Pinned (not ubuntu-latest) so the glibc/PipeWire/VA-API floor this build
    # ships doesn't silently drift with the runner image. ubuntu-24.04, not
    # ubuntu-22.04 (ADR-0024's original choice): two real, distinct build
    # failures on a real ubuntu-22.04 run (not hypothetical) both traced to
    # that release's stock C library headers being too old for this
    # workspace's actual dependencies — `libspa` (a `pipewire` dependency)
    # calls `spa_meta_first`/`spa_meta_region_is_valid`, static-inline
    # helpers absent from ubuntu-22.04's `libspa-0.2-dev`; separately,
    # `cros-libva`'s AV1 encode struct bindings (bindgen'd from system
    # `libva-dev` headers) need fields ubuntu-22.04's libva 2.14 doesn't
    # have. ubuntu-24.04's stock libpipewire/libspa/libva packages are new
    # enough for both — real-verified via WSL2 (also Ubuntu 24.04) — with no
    # PPA/backport needed. glibc floor moves from 2.35 to 2.39 accordingly
    # (see ADR-0024's Linux glibc baseline section and PyPI's manylinux tag).
    runs-on: ubuntu-24.04
    needs: [version, crates]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: oven-sh/setup-bun@v2

      # Same packages ci.yml's Linux verification builds already install —
      # mediaway-device (PipeWire) and mediaway-encoder (cros-libva/VA-API)
      # link against these at build time even though this cdylib doesn't
      # exercise a real device/GPU in this job.
      - name: Install system deps (Linux verification builds)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpipewire-0.3-dev libva-dev

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enable sccache (release namespace)
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_VERSION=mediaway-release-v1" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: mediaway-release-v1
          key: native-linux-x64

      - name: Build + stage cdylib
        run: bun tools/scripts/copy-native-dlls.ts --release --target x86_64-unknown-linux-gnu

      - name: Stage python lib for cross-platform artifact merge
        run: |
          mkdir -p bindings/python/_native-staging/linux-x64
          cp bindings/python/mediaway/_native/* bindings/python/_native-staging/linux-x64/

      - name: Upload native assets (linux-x64)
        uses: actions/upload-artifact@v4
        with:
          name: native-dlls-linux
          path: |
            bindings/nodejs/packages/ffi/native
            bindings/python/_native-staging
            bindings/csharp/runtime/linux-x64/native
            bindings/native/runtime/linux-x64

  native-assets-macos:
    name: native assets (macOS x86_64 + arm64 .dylib)
    runs-on: macos-14
    needs: [version, crates]
    env:
      # Uniform floor across both architectures (ADR-0024) — Big Sur is the
      # first release with native Apple Silicon support.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: oven-sh/setup-bun@v2

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enable sccache (release namespace)
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_VERSION=mediaway-release-v1" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: mediaway-release-v1
          key: native-macos

      - name: Build + stage cdylib (x86_64)
        run: bun tools/scripts/copy-native-dlls.ts --release --target x86_64-apple-darwin

      - name: Stage python lib (osx-x64)
        run: |
          mkdir -p bindings/python/_native-staging/osx-x64
          cp bindings/python/mediaway/_native/* bindings/python/_native-staging/osx-x64/

      - name: Build + stage cdylib (arm64)
        run: bun tools/scripts/copy-native-dlls.ts --release --target aarch64-apple-darwin

      - name: Stage python lib (osx-arm64)
        run: |
          mkdir -p bindings/python/_native-staging/osx-arm64
          cp bindings/python/mediaway/_native/* bindings/python/_native-staging/osx-arm64/

      - name: Upload native assets (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: native-dlls-macos
          path: |
            bindings/nodejs/packages/ffi/native
            bindings/python/_native-staging
            bindings/csharp/runtime/osx-x64/native
            bindings/csharp/runtime/osx-arm64/native
            bindings/native/runtime/osx-x64
            bindings/native/runtime/osx-arm64

  bindings-tests:
    name: bindings tests (RC gate, win-x64)
    runs-on: windows-latest
    needs: [version, native-assets]
    # RC stage: validate the release-built native DLL through every binding
    # round-trip before anything is published. Runs on dry runs too — that is
    # the RC validation step. Every publish job gates on this job.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: native-dlls
          path: bindings

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # C tests compile with MinGW gcc — same toolchain as native-assets.
      - uses: msys2/setup-msys2@v2
        with:
          update: false
      - name: Install MinGW-w64 (ucrt)
        shell: msys2 {0}
        run: pacman -S --noconfirm mingw-w64-ucrt-x86_64-gcc
      - name: Put ucrt64 bin on PATH
        shell: bash
        run: echo "C:\msys64\ucrt64\bin" >> "$GITHUB_PATH"

      # Browser npm test rebuilds the wasm package (wasm-pack + wasm-opt).
      - uses: dtolnay/rust-toolchain@stable
      - name: Add wasm32 target
        shell: bash
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pin: the action's default 'latest' lookup falls back to 0.9.1,
          # whose manifest parser rejects workspace-inherited package fields
          # (license/repository). 0.15.0 supports them.
          version: 'v0.15.0'

      - name: C# round-trip test (Container, no hardware)
        shell: bash
        run: dotnet test bindings/csharp/tests/Mediaway.Container.Tests/Mediaway.Container.Tests.csproj

      - name: C# round-trip test (Pipeline decode, real WMF/Opus hardware)
        shell: bash
        run: dotnet test bindings/csharp/tests/Mediaway.Pipeline.Tests/Mediaway.Pipeline.Tests.csproj

      - name: Python round-trip test
        shell: bash
        working-directory: bindings/python
        run: python tests/test_mux_roundtrip.py

      - name: Python round-trip test (decode)
        shell: bash
        working-directory: bindings/python
        run: python tests/test_decode_roundtrip.py

      - name: Node round-trip test
        shell: bash
        working-directory: bindings/nodejs
        run: |
          bun install
          npm test

      - name: C round-trip test
        shell: bash
        run: bash bindings/c/tests/run-roundtrip.sh

      - name: Browser round-trip test
        shell: bash
        working-directory: bindings/browser/packages/browser
        run: |
          bun install
          npm test

  bindings-tests-linux:
    name: bindings tests (RC gate, linux-x64, container only)
    runs-on: ubuntu-24.04 # matches native-assets-linux's runner (ADR-0024)
    needs: [version, native-assets-linux]
    # GitHub-hosted Linux runners have no GPU — this RC gate can only verify
    # the sans-io container capability (mux/demux), not hardware encode/
    # decode/device-capture (ADR-0024 § CI/CD shape; docs/roadmap.md's
    # "Linux Hardware Verification" gap is unresolved by this change).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: native-dlls-linux
          path: bindings

      # native-assets-linux only uploads the merge-safe _native-staging/
      # linux-x64/ copy of the python native lib (not the real
      # bindings/python/mediaway/_native/ path directly — that upload is
      # win-x64-only, see native-assets' own "Stage python lib" step), so
      # this job must copy it into place itself before any Python-dependent
      # step runs.
      - name: Select python native lib (linux-x64)
        run: |
          mkdir -p bindings/python/mediaway/_native
          cp bindings/python/_native-staging/linux-x64/* bindings/python/mediaway/_native/

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # libmediaway_ffi.so dynamically links libpipewire/libva at runtime even
      # though this job's tests never touch a real device/GPU — omitting them
      # here (unlike native-assets-linux, which already installs them to
      # *build*) surfaced a real DllNotFoundException-via-missing-transitive-
      # dependency failure on the first real run of this job. build-essential
      # is for the C round-trip test's gcc invocation.
      - name: Install system deps (C round-trip build + native lib runtime deps)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libpipewire-0.3-dev libva-dev

      - name: C# container round-trip test (no hardware)
        run: dotnet test bindings/csharp/tests/Mediaway.Container.Tests/Mediaway.Container.Tests.csproj

      - name: Python container round-trip test
        working-directory: bindings/python
        run: python tests/test_mux_roundtrip.py

      - name: Node container round-trip test
        working-directory: bindings/nodejs
        run: |
          bun install
          bun node_modules/typescript/bin/tsc -p packages/ffi/tsconfig.json
          bun node_modules/typescript/bin/tsc -p packages/container/tsconfig.json
          node node_modules/tsx/dist/cli.mjs test/mux-roundtrip.test.ts
          node node_modules/tsx/dist/cli.mjs test/all-formats-smoke.test.ts

      - name: C round-trip test
        run: bash bindings/c/tests/run-roundtrip.sh

  bindings-tests-macos:
    name: bindings tests (RC gate, macOS, container + hardware pipeline)
    runs-on: macos-14
    needs: [version, native-assets-macos]
    # macos-14 is real Apple Silicon hardware with a VideoToolbox backend —
    # unlike bindings-tests-linux, this RC gate also exercises the same
    # hardware-backed AutoEncoder/AutoDecoder round trip
    # bindings-tests (win-x64) already runs for WMF/Opus (ADR-0024).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: native-dlls-macos
          path: bindings

      # This runner is arm64 — select that arch's staged python lib.
      # native-assets-macos never uploads the real bindings/python/mediaway/
      # _native/ path directly (only win-x64's native-assets job does — see
      # its own "Stage python lib" step); macOS/Linux only upload the
      # merge-safe _native-staging/<rid>/ copies (avoids the two
      # architectures colliding on the same filename in one artifact), so
      # this job must copy the right one into place itself before any
      # Python-dependent step runs.
      - name: Select python native lib (osx-arm64)
        run: |
          mkdir -p bindings/python/mediaway/_native
          cp bindings/python/_native-staging/osx-arm64/* bindings/python/mediaway/_native/
          ls -la bindings/python/mediaway/_native

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: C# container round-trip test (no hardware)
        run: dotnet test bindings/csharp/tests/Mediaway.Container.Tests/Mediaway.Container.Tests.csproj

      - name: C# round-trip test (Pipeline, real VideoToolbox hardware)
        run: dotnet test bindings/csharp/tests/Mediaway.Pipeline.Tests/Mediaway.Pipeline.Tests.csproj

      # TEMPORARY — remove alongside the debug_log() helper in
      # crates/mediaway-encoder/src/apple/videotoolbox/video.rs once the real
      # EncoderBackendFailure root cause is confirmed. eprintln! alone doesn't reach this
      # job's console log (VSTest's testhost process isolation swallows raw native stderr),
      # so the diagnostic writes to a fixed-path file instead; dump it regardless of whether
      # the Pipeline test step above passed or failed.
      - name: Dump VideoToolbox debug log (temporary diagnostic)
        if: always()
        run: cat /tmp/mediaway-videotoolbox-debug.log || echo "(no debug log written)"

      - name: Python container round-trip test
        working-directory: bindings/python
        run: python tests/test_mux_roundtrip.py

      - name: Python round-trip test (decode, real hardware)
        working-directory: bindings/python
        run: python tests/test_decode_roundtrip.py

      - name: Node round-trip test
        working-directory: bindings/nodejs
        run: |
          bun install
          npm test

      - name: C round-trip test
        run: bash bindings/c/tests/run-roundtrip.sh

  npm:
    name: npm (@mediaway/*)
    runs-on: windows-latest
    needs: [version, native-assets, native-assets-linux, native-assets-macos, bindings-tests, bindings-tests-linux, bindings-tests-macos]
    environment: release
    env:
      MEDIAWAY_SKIP_CARGO_BUILD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Browser prepack runs `wasm-pack build` + wasm-opt -Oz size pass (bindings/browser/packages/browser)
      - name: Add wasm32 target
        shell: bash
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pin: the action's default 'latest' lookup falls back to 0.9.1,
          # whose manifest parser rejects workspace-inherited package fields
          # (license/repository). 0.15.0 supports them.
          version: 'v0.15.0'

      - uses: oven-sh/setup-bun@v2

      - uses: actions/download-artifact@v4
        with:
          name: native-dlls
          path: bindings

      - uses: actions/download-artifact@v4
        with:
          name: native-dlls-linux
          path: bindings

      - uses: actions/download-artifact@v4
        with:
          name: native-dlls-macos
          path: bindings

      - name: Install node deps (workspace root)
        run: bun install
        working-directory: bindings/nodejs

      - name: Install browser dev deps
        run: bun install
        working-directory: bindings/browser/packages/browser

      - name: Build node packages (tsc)
        shell: bash
        run: bun tools/scripts/build-node-packages.ts --release

      - name: Stamp npm versions
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bun -e '
          for (const p of ["ffi", "container", "device", "encoder", "decoder"]) {
            const f = `bindings/nodejs/packages/${p}/package.json`;
            const j = JSON.parse(await Bun.file(f).text());
            j.version = process.env.VERSION;
            await Bun.write(f, JSON.stringify(j, null, 2) + "\n");
          }
          const fb = "bindings/browser/packages/browser/package.json";
          const jb = JSON.parse(await Bun.file(fb).text());
          jb.version = process.env.VERSION;
          await Bun.write(fb, JSON.stringify(jb, null, 2) + "\n");
          '
          echo "stamped npm versions to $VERSION"

      - name: Ensure npm >= 11.5.1 (OIDC trusted publishing)
        shell: bash
        run: npm install -g npm@latest

      - name: Validate packs (npm publish --dry-run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        shell: bash
        run: |
          for p in ffi container device encoder decoder; do
            (cd "bindings/nodejs/packages/$p" && npm publish --dry-run)
          done
          (cd bindings/browser/packages/browser && npm publish --dry-run)

      - name: Publish npm packages (ffi → container/device/encoder/decoder → browser)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Diagnostics for the OIDC trusted-publishing flow (temporary).
          echo "node: $(node --version) npm: $(npm --version)"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:+present}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+present}"
          PROV=""
          if [[ "${{ github.event.inputs.npm_provenance }}" != "false" ]]; then PROV="--provenance"; fi
          # No auth token: npm OIDC Trusted Publishing authenticates this
          # workflow (id-token permission above). Requires the @mediaway org
          # to have added nyxways/mediaway as a trusted publisher.
          # Skip versions already on the registry (a manual first publish
          # precedes OIDC: 0.1.0/0.1.1 were published by hand) — npm rejects
          # republishing an existing version with 409.
          for p in ffi container device encoder decoder; do
            if npm view "@mediaway/$p@$VERSION" version >/dev/null 2>&1; then
              echo "@mediaway/$p@$VERSION already published — skip"
            else
              (cd "bindings/nodejs/packages/$p" && npm publish --access public $PROV --loglevel verbose)
            fi
          done
          if npm view "@mediaway/browser@$VERSION" version >/dev/null 2>&1; then
            echo "@mediaway/browser@$VERSION already published — skip"
          else
            (cd bindings/browser/packages/browser && npm publish --access public $PROV --loglevel verbose)
          fi

  nuget:
    name: nuget (Mediaway.*)
    runs-on: windows-latest
    needs: [version, native-assets, native-assets-linux, native-assets-macos, bindings-tests, bindings-tests-linux, bindings-tests-macos]
    environment: release
    env:
      MEDIAWAY_SKIP_CARGO_BUILD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/download-artifact@v4
        with:
          name: native-dlls
          path: bindings

      - uses: actions/download-artifact@v4
        with:
          name: native-dlls-linux
          path: bindings

      - uses: actions/download-artifact@v4
        with:
          name: native-dlls-macos
          path: bindings

      - name: Stamp NuGet version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i "s|<Version>[^<]*</Version>|<Version>$VERSION</Version>|" bindings/csharp/src/Directory.Build.props
          grep -n "<Version>" bindings/csharp/src/Directory.Build.props

      - name: Pack nupkgs
        shell: bash
        run: bun tools/scripts/package-csharp.ts --release

      # Tokenless: exchange the job's OIDC id-token for a 1-hour API key via
      # the nuget.org Trusted Publishing policy (nuget.org → Trusted
      # Publishing → repo nyxways/mediaway, workflow file release.yml). Needs
      # the nuget.org username in the NUGET_USER secret.
      - name: NuGet login (OIDC → temp API key)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push nupkgs (skip duplicates)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: bash
        run: |
          for f in bindings/csharp/dist/Mediaway.*.nupkg; do
            dotnet nuget push "$f" --api-key "$NUGET_API_KEY" \
              -s https://api.nuget.org/v3/index.json --skip-duplicate
          done
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}

  pypi:
    name: pypi (mediaway)
    runs-on: windows-latest
    needs: [version, native-assets, native-assets-linux, native-assets-macos, bindings-tests, bindings-tests-linux, bindings-tests-macos]
    env:
      MEDIAWAY_SKIP_CARGO_BUILD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --quiet build

      - uses: actions/download-artifact@v4
        with:
          name: native-dlls
          path: bindings

      - uses: actions/download-artifact@v4
        with:
          name: native-dlls-linux
          path: bindings

      - uses: actions/download-artifact@v4
        with:
          name: native-dlls-macos
          path: bindings

      - name: Stamp PyPI version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i "s|^version[[:space:]]*=[[:space:]]*\"[^\"]*\"|version = \"$VERSION\"|" bindings/python/pyproject.toml
          grep -n "^version" bindings/python/pyproject.toml

      # One wheel per (OS, arch) — ADR-0024. build-python-package.ts cleans
      # bindings/python/mediaway/_native/ and re-stages it from
      # _native-staging/<rid> (populated by every native-assets-* job) before
      # each build, so no platform's lib leaks into another's wheel.
      - name: Build wheels (one per platform)
        shell: bash
        run: |
          for rid in win-x64 linux-x64 osx-x64 osx-arm64; do
            rm -f bindings/python/mediaway/_native/*
            cp "bindings/python/_native-staging/$rid"/* bindings/python/mediaway/_native/
            bun tools/scripts/build-python-package.ts --release --target "$rid"
          done

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: bindings/python/dist

  pypi-publish:
    name: pypi publish (mediaway)
    runs-on: ubuntu-latest
    needs: [pypi]
    environment: release
    # PyPI Trusted Publishing (OIDC): pending publisher configured on pypi.org
    # for nyxways/mediaway@release.yml (environment: release) — no API token.
    # `attestations: true` emits PEP 740 provenance (needs id-token: write,
    # granted at the workflow level). Runs on Linux: gh-action-pypi-publish's
    # Docker container cannot start on the Windows build runner.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist

      - name: Publish wheel to PyPI (OIDC trusted publishing)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          attestations: true
          # Skip versions already on PyPI (409 on re-run) — first publish of a
          # version happens once per release.
          skip-existing: true

  crates:
    name: crates.io
    runs-on: ubuntu-latest
    needs: [version]
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2

      # `cargo package`'s verification build compiles the workspace's
      # cfg(target_os = "linux") backends on this ubuntu runner, so the
      # system dev libraries they link against must be present: libpipewire
      # (mediaway-device), libva (mediaway-encoder's cros-libva). libclang +
      # Linux headers are preinstalled on GitHub runners (v4l bindgen).
      - name: Install system deps (Linux verification builds)
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpipewire-0.3-dev libva-dev

      # Dependency-ordered publish of the 20-crate set (see
      # tools/scripts/publish-crates.ts). The gate also runs on dry runs so
      # `cargo package` validation happens for every crate before any real
      # upload.
      # Auth: OIDC trusted publishing when the crates.io publisher is
      # configured (rust-lang/crates-io-auth-action exchanges the job's
      # id-token); the CARGO_REGISTRY_TOKEN secret remains the fallback.
      - name: Authenticate with crates.io (OIDC trusted publishing)
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1
        continue-on-error: true

      - name: Publish crates (dependency order)
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            bun tools/scripts/publish-crates.ts --dry-run
          else
            bun tools/scripts/publish-crates.ts
          fi

  native:
    name: cpp (CPack, every platform)
    runs-on: windows-latest
    needs: [version, native-assets, native-assets-linux, native-assets-macos, bindings-tests, bindings-tests-linux, bindings-tests-macos]
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: native-dlls
          path: bindings

      - uses: actions/download-artifact@v4
        with:
          name: native-dlls-linux
          path: bindings

      - uses: actions/download-artifact@v4
        with:
          name: native-dlls-macos
          path: bindings

      - name: Stamp CPack version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i "s|project(mediaway-bindings VERSION [^ ]*|project(mediaway-bindings VERSION $VERSION|" bindings/cpp/CMakeLists.txt
          grep -n "project(mediaway-bindings" bindings/cpp/CMakeLists.txt

      # No actual compilation happens here — `mediaway` is a header-only
      # INTERFACE target over a prebuilt native lib (see
      # bindings/cpp/CMakeLists.txt), so a fresh configure+build+cpack per
      # platform tag can all run on this one Windows runner, pointed at each
      # platform's already-downloaded native dir. Four archives out of one
      # job, no Linux/macOS runner needed for packaging itself.
      - name: Configure + package (every platform)
        shell: bash
        run: |
          mkdir -p dist-all
          for tag in win64 linux-x64 macos-x64 macos-arm64; do
            case "$tag" in
              win64) native_dir="bindings/native/runtime/win-x64" ;;
              linux-x64) native_dir="bindings/native/runtime/linux-x64" ;;
              macos-x64) native_dir="bindings/native/runtime/osx-x64" ;;
              macos-arm64) native_dir="bindings/native/runtime/osx-arm64" ;;
            esac
            rm -rf build
            cmake -S bindings/cpp -B build \
              -DMEDIAWAY_PLATFORM_TAG="$tag" \
              -DMEDIAWAY_NATIVE_DIR_OVERRIDE="$PWD/$native_dir"
            cmake --build build --config Release
            # Run cpack from the build dir: its staging dir (_CPack_Packages)
            # follows the invoking cwd, and the outputs go to build/dist
            # (CPACK_OUTPUT_FILE_PREFIX in CMakeLists.txt).
            (cd build && cpack --config CPackConfig.cmake)
            cp build/dist/Mediaway-*.zip build/dist/Mediaway-*.tar.gz dist-all/
          done

      - name: Upload CPack archives
        uses: actions/upload-artifact@v4
        with:
          name: cpack-archives
          path: dist-all/Mediaway-*

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [version, npm, nuget, pypi, pypi-publish, native, crates]
    environment: release
    if: ${{ github.event.inputs.dry_run != 'true' }}
    steps:
      - uses: actions/checkout@v4
        # gh release needs a git repo to identify the remote + target ref

      - uses: actions/download-artifact@v4
        with:
          name: cpack-archives
          path: archives

      - name: Create tag + release, attach CPack archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          ls -1 archives
          # Release notes: prefer the hand-written RELEASE_NOTES.md on the
          # release branch; fall back to GitHub-generated notes.
          NOTES=("--generate-notes")
          if [[ -f RELEASE_NOTES.md ]]; then
            NOTES=(--notes-file RELEASE_NOTES.md)
            echo "using RELEASE_NOTES.md for release notes"
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" \
            --title "Mediaway $VERSION" "${NOTES[@]}"
          gh release upload "v$VERSION" archives/*.zip archives/*.tar.gz
