[workspace]
resolver = "2"
members = [
    "crates/mediaway-common",
    "crates/iso-cenc",
    "crates/iso-bmff",
    "crates/ebml-webm",
    "crates/riff-wave-core",
    "crates/adts-core",
    "crates/mpeg-audio",
    "crates/ogg-core",
    "crates/flv-core",
    "crates/mpeg-ts-core",
    "crates/rtp-core",
    "crates/rtmp",
    "crates/mediaway-container",
    "crates/mediaway-ffi",
    "crates/mediaway",


    "crates/mediaway-encoder",




    "crates/vpl-sys",



    "crates/iso-bmff-wasm",

    "crates/mediaway-decoder",
    "crates/mediaway-device",



    "crates/mediaway-sw",


    "crates/mediaway-test-media",

    "tools/mediaway-avcli",
    "tools/mediaway-avprobe",
    "examples",
]
# Further platform backends (mediaway-*-web, …) are added when that backend lands.
# C ABI: mediaway-*-ffi (+ optional feature-gated mediaway-ffi) when Rust MVP is wrappable
# See docs/spec/c-ffi.md · docs/adr/0004-c-ffi.md
# See docs/spec/crate-packaging.md · docs/adr/0003-crate-packaging.md

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nyxways/mediaway"
authors = ["NyxWays"]
publish = false # early development — see docs/spec/status.md

[workspace.dependencies]
mediaway-common = { path = "crates/mediaway-common", version = "0.1" } # lockstep with workspace version
iso-cenc = { path = "crates/iso-cenc", version = "0.1.1" }
iso-bmff = { path = "crates/iso-bmff", version = "0.1.1" }
ebml-webm = { path = "crates/ebml-webm", version = "0.2.1" }
riff-wave-core = { path = "crates/riff-wave-core", version = "0.1.1" }
adts-core = { path = "crates/adts-core", version = "0.1.1" }
mpeg-audio = { path = "crates/mpeg-audio", version = "0.1.1" }
ogg-core = { path = "crates/ogg-core", version = "0.1.1" }
flv-core = { path = "crates/flv-core", version = "0.1.1" }
mpeg-ts-core = { path = "crates/mpeg-ts-core", version = "0.1.1" }
rtp-core = { path = "crates/rtp-core", version = "0.1.0" }
rtmp = { path = "crates/rtmp", version = "0.1.0" }
mediaway-container = { path = "crates/mediaway-container", version = "0.1" } # lockstep with workspace version
mediaway-ffi = { path = "crates/mediaway-ffi", version = "0.1" } # lockstep with workspace version

mediaway = { path = "crates/mediaway", version = "0.1" } # lockstep with workspace version

mediaway-encoder = { path = "crates/mediaway-encoder", version = "0.1" } # lockstep with workspace version




vpl-sys = { path = "crates/vpl-sys", version = "0.1" } # lockstep with workspace version

mediaway-decoder = { path = "crates/mediaway-decoder", version = "0.1" } # lockstep with workspace version



mediaway-device = { path = "crates/mediaway-device", version = "0.1" } # lockstep with workspace version








iso-bmff-wasm = { path = "crates/iso-bmff-wasm", version = "0.1" } # lockstep with workspace version


mediaway-sw = { path = "crates/mediaway-sw", version = "0.1" } # lockstep with workspace version


mediaway-test-media = { path = "crates/mediaway-test-media", version = "0.1" } # lockstep with workspace version

# Official Win32 projection (MIT OR Apache-2.0). Feature set per consumer crate.
windows = { version = "0.62", default-features = false }
# COM `#[implement]` expansion needs the `windows_core` crate name in scope.
windows-core = { version = "0.62", default-features = false, features = ["std"] }
# xdg-desktop-portal D-Bus client (zbus-based), MIT. See mediaway-device-linux/adr/0001.
ashpd = { version = "0.13", default-features = false }
# Safe Rust bindings to libpipewire (gitlab.freedesktop.org/pipewire/pipewire-rs), MIT.
pipewire = { version = "0.10" }
# Safe V4L2 bindings for mediaway-device-linux's camera backend (cfg(target_os
# = "linux") only). MIT. `default-features = false` + `v4l2` feature only —
# the crate's whole safe API surface (Device/Stream/Capture) never needs
# `unsafe` at our call sites; the optional `libv4l` feature (unused here)
# would dynamically link the LGPL `libv4lconvert`/`libv4l2` userspace
# convenience libraries instead of talking raw ioctls via bindgen'd
# `videodev2.h` UAPI headers. See
# crates/mediaway-device-linux/adr/0002-v4l2-camera-capture.md.
v4l = { version = "0.14", default-features = false, features = ["v4l2"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", default-features = false }
thiserror = "2.0"
blake3 = "1.8"
bytes = "1.10"
# Inline small lists (tracks, trun rows); heap spill OK. See ADR-0009.
smallvec = { version = "1.15", default-features = false, features = ["const_generics"] }
# SIMD-friendly byte/substring search (Annex-B, scanners). See perf-crates.md.
memchr = { version = "2.8", default-features = false }
# AES block cipher for ClearKey CENC (ADR-0011); CTR rules owned by iso-cenc.
aes = { version = "0.9", default-features = false }
# Bench harness (docs/conventions/benchmarking.md); dev-dependency only, never shipped.
criterion = "0.7"
# Safe libva (VA-API) bindings for mediaway-encoder-linux; cfg(target_os = "linux") only.
# BSD-3-Clause; see crates/mediaway-encoder-linux/adr/0001-vaapi-cros-libva-h264-cpu-upload.md.
cros-libva = "0.0.13"
# Hand-written (not bindgen'd) safe NVENC (`nvEncodeAPI`) bindings for
# mediaway-encoder-nvenc; cfg(windows) only this stage. MIT. Dynamically loads
# `nvEncodeAPI64.dll` via its own internal `libloading` use at runtime — no
# Video Codec SDK download or build-time link. See
# crates/mediaway-encoder-nvenc/adr/0001-nvenc-vendor-backend.md (2026-07-29
# addendum: depended on directly rather than vendoring `nvenc-sys`, after
# hardware verification on a real RTX 4090 showed this crate's safe surface —
# used via its D3D11 texture path, not its native CPU input-buffer lock path,
# see the addendum — is sufficient for Stage 1 CPU-upload H.264).
nvenc = "0.1"
# Pure-Rust AV1 encoder for mediaway-sw; BSD-2-Clause, no C/asm toolchain needed
# with default-features = false. See crates/mediaway-sw/adr/0002-rav1e-av1-encode.md.
rav1e = { version = "0.8", default-features = false }
# GPU framework interop (mediaway-wgpu — Stage 1: Windows DX12 HAL bridge).
# MIT OR Apache-2.0. Bumped from 26.x to 30.x now that workspace rust-version
# = "1.96" (ADR-0023) clears 30.x's rustc floor (1.93). Base entry carries no
# backend feature (types compile everywhere); platform crates add their own
# backend (`dx12`, later `vulkan`/`metal`) via target-cfg'd deps.
# See crates/mediaway/adr/wgpu/0001-dx12-hal-gpucopy-bridge.md and
# crates/mediaway/adr/wgpu/0004-wgpu-30-upgrade.md.
wgpu = { version = "30.0", default-features = false, features = ["std"] }
# Blocks on wgpu's async adapter/device requests inside sync `#[test]` fns —
# standard wgpu-ecosystem pairing (mediaway-wgpu tests only). MIT OR Apache-2.0.
pollster = "0.4"
# Vulkan bindings for mediaway-encoder-vulkan (VK_KHR_video_encode_queue, incl.
# VK_KHR_video_encode_av1). Apache-2.0. `libloading` feature dynamically resolves
# the system Vulkan loader (vulkan-1.dll / libvulkan.so.1) at runtime — no
# build-time link against a Vulkan SDK import lib. Replaces `ash` (2026-07-29):
# `ash` 0.38.0+1.3.281 has had no crates.io release since 2024-04-01 (maintainer-
# confirmed batching of breaking generator changes, ash-rs/ash#1001) and has no
# `video_encode_av1` module at all; `vulkanalia` is actively released (0.35.0,
# 2026-02-15) and already ships full `VK_KHR_video_encode_av1` bindings. See
# crates/mediaway-encoder-vulkan/adr/0001.
vulkanalia = { version = "0.35", default-features = false, features = ["std", "libloading"] }
# Pure-Rust libopus (c2rust transpile) for mediaway-sw-opus. BSD-3-Clause. C-shaped
# `unsafe fn` API confined to that one crate; ~20% CPU cost vs C reference (no asm/SIMD).
# See crates/mediaway-sw-opus/adr/0001-unsafe-libopus-encode-decode.md.
unsafe-libopus = "0.2"
# Pure-Rust WebRTC AudioProcessing (AEC3/NS/AGC2) + standalone RNN VAD, for
# mediaway-audio-apm. BSD-3-Clause, SIMD-accelerated (SSE2/AVX2/NEON, scalar
# fallback). See crates/mediaway-audio-apm/adr/0001-sonora-audio-processing-adoption.md.
sonora = { version = "0.2" }
sonora-agc2 = { version = "0.2" }
sonora-simd = { version = "0.2" }
# RustCrypto HMAC + SHA-256 for the rtmp crate's C0/C1/C2 digest handshake (the one
# crypto primitive this workspace defers to a reviewed dependency rather than
# hand-rolling). MIT OR Apache-2.0. See crates/rtmp/adr/0001-rtmp-freestanding-core.md.
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
# Dynamic runtime loading (LoadLibrary/GetProcAddress · dlopen/dlsym) for vpl-sys's oneVPL MVP
# dispatcher — MIT OR Apache-2.0, tiny, no controversy. See crates/vpl-sys, mediaway-encoder-quicksync/adr/0001.
libloading = "0.8"
# Build-time-only: parses vpl-sys's vendored oneVPL headers for exact struct/union layout.
# BSD-3-Clause. Needs libclang at build time — see crates/vpl-sys/vendor/README.md.
bindgen = { version = "0.71", default-features = false, features = ["runtime"] }

[workspace.lints.rust]
# Default deny. Platform backend crates (`mediaway-*-windows`, etc.) and optional
# `mediaway-*-sys` override with `#![allow(unsafe_code)]` + `// SAFETY:` (see code-style.md).
# (`forbid` cannot be overridden by `allow` — use `deny` so platform crates can opt in.)
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
elided_lifetimes_in_paths = "warn"
async_fn_in_trait = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
