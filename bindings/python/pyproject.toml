[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediaway"
version = "0.1.0"
description = "Idiomatic Python binding over Mediaway's C ABI (mux/demux, auto video encode, camera/mic capture)"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }

[tool.setuptools]
packages = ["mediaway"]
