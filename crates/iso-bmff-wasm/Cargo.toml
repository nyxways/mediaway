[package]
name = "iso-bmff-wasm"
description = "WASM bindings for iso-bmff mux/demux (browser)"
version.workspace = true
publish.workspace = true # not yet hardware-verified — see docs/roadmap.md
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-pack's own wasm-opt integration is off (binaryen auto-download is
# flaky on Windows); the browser package runs tools/scripts/optimize-wasm.ts
# (pinned binaryen, -Oz) as a deterministic post-pass instead. Min-size
# opt-level comes from .cargo/config.toml [target.wasm32-unknown-unknown].
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
iso-bmff = { workspace = true, features = ["full"] }
bytes = { workspace = true }
wasm-bindgen = { workspace = true }

[lints]
workspace = true
