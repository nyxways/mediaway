[package]
name = "mediaway-audio-apm"
description = "Audio enhancement (echo cancellation, noise suppression, gain control, voice activity detection) — thin Mediaway-typed adapter over the pure-Rust `sonora` WebRTC Audio Processing port"
version.workspace = true
publish = false # early development — see docs/spec/status.md
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
mediaway-common = { workspace = true }
thiserror = { workspace = true }
sonora = { workspace = true, optional = true }
sonora-agc2 = { workspace = true, optional = true }
sonora-simd = { workspace = true, optional = true }

[features]
default = []
# AEC3 + NS + AGC2 via sonora::AudioProcessing (render/capture split, see ADR-0001).
apm = ["dep:sonora"]
# Standalone RNN voice-activity detector via sonora-agc2 (see ADR-0001's VAD scaling caveat).
vad = ["dep:sonora-agc2", "dep:sonora-simd"]
full = ["apm", "vad"]

[lints]
workspace = true
