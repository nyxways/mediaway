[package]
name = "mediaway-decoder-linux"
description = "Linux VA-API video decode backend (H.264 CPU-output path)"
version.workspace = true
publish.workspace = true # not yet hardware-verified — see docs/roadmap.md
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
mediaway-common = { workspace = true }
mediaway-decoder = { workspace = true }
mediaway-sw = { workspace = true }

[features]
default = ["video"]
video = ["mediaway-decoder/video"]

# VA-API bindings only on Linux: this crate must stay buildable (as an honest
# `Unsupported` stub) on non-Linux hosts running `cargo check --workspace`
# without pulling in `cros-libva`'s `libva`/`pkg-config`/bindgen build step.
# Mirrors `mediaway-decoder-windows`'s `[target.'cfg(windows)'.dependencies]` and
# `mediaway-encoder-linux`'s identical Linux gate.
[target.'cfg(target_os = "linux")'.dependencies]
cros-libva = { workspace = true }

[lints]
workspace = true
