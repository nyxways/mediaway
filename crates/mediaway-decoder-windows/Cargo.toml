[package]
name = "mediaway-decoder-windows"
description = "Windows Media Foundation / DX11 video decode backend"
version.workspace = true
publish = true # hardware-verified — see docs/roadmap.md
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
mediaway-common = { workspace = true }
mediaway-decoder = { workspace = true }
iso-bmff = { workspace = true }
# `d3d12_video_decode`'s H.264 NAL/bit framing reuse (BitReader/NalUnit/split_annex_b/
# split_avcc only — not the IDR-only Sps/Pps/SliceHeader, see ADR-0002).
mediaway-sw = { workspace = true }
smallvec = { workspace = true }

[features]
default = ["full"]
video = ["mediaway-decoder/video"]
# No `mediaway-decoder/audio` link yet — the facade has no `AudioDecoder` trait to depend
# on (only `VideoDecoder`); see `src/wmf/opus.rs` module docs.
audio = []
full = ["audio", "video"]

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Media_MediaFoundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[lints]
workspace = true

[dev-dependencies]
mediaway-encoder = { workspace = true, features = ["video"] }
criterion = { workspace = true }

[[bench]]
name = "wmf_h264_decode"
harness = false
