[package]
name = "mediaway-device-ffi"
description = "C ABI facade over mediaway-device-camera/-desktop/-audio (Camera; Screen/Window + Loopback/ProcessLoopback; Microphone) capture, plus hotplug — see docs/spec/c-ffi.md"
version.workspace = true
publish = false # no header/ABI has shipped yet — see docs/roadmap.md
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
mediaway-common = { workspace = true }
mediaway-common-ffi = { path = "../mediaway-common-ffi", version = "0.1.0" }
mediaway-device = { workspace = true }
mediaway-device-camera = { workspace = true, optional = true }
mediaway-device-desktop = { workspace = true, optional = true }
mediaway-device-audio = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
# Per-domain backends, not the `mediaway-device-windows` orchestrator — enabling only
# one of camera/desktop/audio must not link the others' driver code
# (`adr/0004-domain-feature-split.md`). `hotplug` is the one feature that still needs
# the orchestrator (v1 hotplug scope spans Audio I/O + Desktop kinds; its real backend
# lives there — see that crate's own module doc).
mediaway-device-windows-camera = { workspace = true, optional = true }
mediaway-device-windows-desktop = { workspace = true, optional = true }
mediaway-device-windows-audio = { workspace = true, optional = true }
mediaway-device-windows = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
mediaway-device-linux = { workspace = true }

[features]
default = ["camera", "desktop", "audio", "hotplug"]
camera = ["dep:mediaway-device-camera", "dep:mediaway-device-windows-camera"]
desktop = ["dep:mediaway-device-desktop", "dep:mediaway-device-windows-desktop"]
audio = ["dep:mediaway-device-audio", "dep:mediaway-device-windows-audio"]
hotplug = ["dep:mediaway-device-windows"]

[lints]
workspace = true
