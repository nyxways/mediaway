[package]
name = "mediaway-device-linux"
description = "Linux xdg-desktop-portal + PipeWire capture backend"
version.workspace = true
publish.workspace = true # not yet hardware-verified — see docs/roadmap.md
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
mediaway-common = { workspace = true }
mediaway-device = { workspace = true }
mediaway-device-camera = { workspace = true }
mediaway-device-desktop = { workspace = true }
mediaway-device-audio = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# xdg-desktop-portal D-Bus client (ScreenCast session handshake). `async-io` keeps
# the executor to the smol-rs reactor instead of pulling in tokio (no other crate
# in this workspace depends on tokio yet). Deliberately NOT enabling ashpd's own
# `pipewire` feature: it pins `pipewire = "^0.9"` (pipewire-sys 0.9.2), which
# conflicts (same native `links = "pipewire-0.3"` key) with the `pipewire = "0.10"`
# we depend on directly below — cargo only allows one crate to claim a `links`
# key in the whole graph. We don't need that feature: it only wires ashpd's own
# `From<pipewire::Error>` conversion, which this crate doesn't use (see portal.rs
# error mapping).
ashpd = { workspace = true, default-features = false, features = [
    "screencast",
    "async-io",
] }
# Safe Rust bindings to libpipewire (build-time pkg-config: libpipewire-0.3).
pipewire = { workspace = true }
# Safe V4L2 bindings for camera capture (build-time: bindgen + libclang +
# system <linux/videodev2.h>, no runtime library link). See
# adr/0002-v4l2-camera-capture.md.
v4l = { workspace = true }

[lints]
workspace = true
