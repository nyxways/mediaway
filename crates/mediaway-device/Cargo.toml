[package]
name = "mediaway-device"
description = "Device capture: camera, microphone, screen/window, audio playback + hotplug, with Windows/Linux/Web backends as #[cfg]-gated modules"
version.workspace = true
publish = true # hardware-verified — see docs/roadmap.md
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# cdylib: the browser (`web`) module's `#[wasm_bindgen]` exports are consumed
# by the e2e-web fixtures (`tools/e2e-web/scripts/build-wasm.ts`) — the crate
# must emit a `.wasm` artifact for wasm32 targets.
[lib]
crate-type = ["cdylib", "rlib"]


[dependencies]
mediaway-common = { workspace = true }
thiserror = { workspace = true }









wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }


[lints]
workspace = true


[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = { workspace = true }


[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { workspace = true, default-features = false, features = [
    "screencast",
    "async-io",
] }
# Safe Rust bindings to libpipewire (build-time pkg-config: libpipewire-0.3).
# `v0_3_44` unlocks `pw::keys::TARGET_OBJECT` (mic.rs device targeting, ADR-0004
# addendum) — PipeWire 0.3.44 released 2021; every mainstream distro's PipeWire
# packages this workspace targets are newer.
pipewire = { workspace = true, features = ["v0_3_44"] }
# Safe V4L2 bindings for camera capture (build-time: bindgen + libclang +
# system <linux/videodev2.h>, no runtime library link). See
# adr/0002-v4l2-camera-capture.md.
v4l = { workspace = true }


[target.'cfg(target_os = "android")'.dependencies]
# Safe NDK bindings — AAudio (mic) + ImageReader/NativeWindow (camera + screencast output).
# `nativewindow`/`bitmap`/`sync` intentionally omitted (unused). See
# adr/android/0001-camera2-ndk-native-camera-capture.md · 0002-aaudio-microphone-capture.md.
ndk = { version = "0.9", features = ["audio", "media"] }
# Raw Camera2 NDK FFI — no safe wrapper crate exists (see adr/android/0001). Pinned to the same
# version `ndk` 0.9 itself depends on, so both crates resolve to one `ndk-sys` instance and
# their `ANativeWindow`/etc. types are identical (not just structurally compatible).
ndk-sys = "0.6"
# JNI calls for `MediaProjection.createVirtualDisplay`/`.stop()` — this crate's first JNI
# dependency, needed only by `android::screencast`. See adr/android/0003.
jni = "0.22"


[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
# Objective-C runtime core — `define_class!`/`msg_send!`/`Retained`/`ProtocolObject` for the
# camera/screen-capture delegate classes. See adr/apple/0001 § "materially different kind of
# Apple API than the encoder's VideoToolbox" (real Cocoa classes + delegate protocols, unlike
# mediaway-encoder::apple's plain-C VideoToolbox calls).
objc2 = { version = "0.6" }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSArray",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSObject",
    "NSString",
    "NSValue",
] }
block2 = { version = "0.6" }
dispatch2 = { version = "0.3" }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "CFString",
    "CFDictionary",
    "CFArray",
    "CFNumber",
] }
objc2-core-media = { version = "0.3", default-features = false, features = [
    "CMBase",
    "CMFormatDescription",
    "CMSampleBuffer",
    "CMTime",
    "CMTimeRange",
    "CMBlockBuffer",
    # Gates `CMAudioFormatDescriptionGetStreamBasicDescription` and the
    # `AudioStreamBasicDescription` interop used by `apple::replaykit`'s app/mic audio extraction.
    "objc2-core-audio-types",
    # Gates `CMSampleBuffer::image_buffer` (`apple::pixel`'s shared CVPixelBuffer readback).
    "objc2-core-video",
] }
objc2-core-video = { version = "0.3", default-features = false, features = [
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = [
    "CoreAudioBaseTypes",
] }
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "AVCaptureDevice",
    "AVCaptureInput",
    "AVCaptureOutput",
    "AVCaptureOutputBase",
    "AVCaptureSession",
    "AVCaptureVideoDataOutput",
    "AVMediaFormat",
    "block2",
    # Gates `setSampleBufferDelegate:queue:`'s `DispatchQueue` parameter.
    "dispatch2",
    "objc2-core-media",
] }
objc2-avf-audio = { version = "0.3", default-features = false, features = [
    "AVAudioBuffer",
    "AVAudioEngine",
    "AVAudioFormat",
    # Gates `AVAudioEngine::inputNode` (with `AVAudioNode`).
    "AVAudioIONode",
    "AVAudioNode",
    "AVAudioTime",
    "AVAudioTypes",
    "block2",
] }


[target.'cfg(target_os = "macos")'.dependencies]
# ScreenCaptureKit (macOS 12.3+, see adr/apple/0003) — macOS-only, unlike the `any(macos, ios)`
# dependencies above.
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = [
    "SCStream",
    "SCShareableContent",
    "block2",
    "objc2-core-media",
    "objc2-core-graphics",
    "dispatch2",
] }
# `CGPreflightScreenCaptureAccess`/`CGRequestScreenCaptureAccess` (adr/apple/0003 § permission
# model) — plain, safe C functions.
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "CGWindow",
] }


[target.'cfg(target_os = "ios")'.dependencies]
# ReplayKit (adr/apple/0004) — iOS-only in this crate even though the crate itself also
# compiles on macOS (macOS keeps ScreenCaptureKit instead, see adr/apple/0003 § dependency
# review).
objc2-replay-kit = { version = "0.3", default-features = false, features = [
    "RPScreenRecorder",
    "RPBroadcastExtension",
    "block2",
    "objc2-core-media",
] }


[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window",
    "Navigator",
    "MediaDevices",
    "MediaStream",
    "MediaStreamConstraints",
    "MediaTrackConstraints",
    "DisplayMediaStreamConstraints",
] }


[features]
default = []
