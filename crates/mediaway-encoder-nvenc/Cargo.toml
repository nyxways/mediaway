[package]
name = "mediaway-encoder-nvenc"
description = "NVIDIA NVENC direct vendor video encode backend (H.264 CPU-upload, Stage 1)"
version.workspace = true
publish = true # hardware-verified — see docs/roadmap.md
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
mediaway-common = { workspace = true }
mediaway-encoder = { workspace = true }

[features]
default = ["video"]
video = ["mediaway-encoder/video"]

# NVENC session lifecycle (`nvenc` crate) + the private D3D11 device this stage
# uses to satisfy NVENC's `NV_ENC_DEVICE_TYPE_DIRECTX` session requirement and
# upload CPU NV12 frames. Windows only this stage: this crate must stay
# buildable (as an honest `Unsupported` stub) on non-Windows hosts running
# `cargo check --workspace`. Mirrors `mediaway-encoder-windows` / `-linux`'s
# `[target.'cfg(...)'.dependencies]` pattern.
[target.'cfg(windows)'.dependencies]
nvenc = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }

[lints]
workspace = true
