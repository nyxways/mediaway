[package]
name = "mediaway-encoder"
description = "Hardware-accelerated video/audio encoding (OS-native backends)"
version.workspace = true
publish = true # hardware-verified — see docs/roadmap.md
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true


[dependencies]
mediaway-common = { workspace = true }
thiserror = { workspace = true }


mediaway-sw = { workspace = true }


# Vulkan bindings. `libloading` dynamically resolves the system Vulkan loader at
# runtime — never a build-time link requirement. See adr/0001 (2026-07-29


# oneVPL bindings only on Windows this stage: this crate must stay buildable
# (as an honest `Unsupported` stub) on non-Windows hosts running
# `cargo check --workspace` without pulling in `vpl-sys`'s `bindgen`/`libclang`
# build step. Mirrors `mediaway-encoder-linux`'s `[target.'cfg(target_os = "linux")'.dependencies]`.
iso-bmff = { workspace = true, features = ["full"] }
bytes = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }


[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Vulkan Video bindings — desktop only; libloading is not wasm32-compatible.
vulkanalia = { workspace = true }

[lints]
workspace = true


[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
mediaway-container = { workspace = true, features = ["full"] }
criterion = { workspace = true }


[target.'cfg(windows)'.dependencies]
nvenc = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
vpl-sys = { workspace = true }


[target.'cfg(target_os = "linux")'.dependencies]
cros-libva = { version = "0.0.13" }

# AMD AMF (`shiguredo_amf` — NOT `amf-rs`, an unrelated GPL-3.0-or-later crate; see
# adr/amf/0001 and adr/amf/0002). `x86_64`-only per the crate's own platform limit, hence
# the stricter `target_arch` gate below rather than the plain `target_os = "linux"` one
# `cros-libva` uses.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
shiguredo_amf = { version = "2026.3.0" }


[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", features = ["media"] }


[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-video-toolbox = { version = "0.3", default-features = false, features = [
    "VTCompressionSession",
    "VTCompressionProperties",
    "VTErrors",
    "VTSession",
    "objc2-core-media",
    "objc2-core-video",
] }
objc2-core-media = { version = "0.3", default-features = false, features = [
    "CMBase",
    "CMFormatDescription",
    "CMSampleBuffer",
    "CMTaggedBufferGroup",
    "CMTime",
    "CMTimeRange",
    "CMBlockBuffer",
] }
objc2-core-video = { version = "0.3", default-features = false, features = [
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVPixelBufferPool",
    "CVReturn",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "CFString",
    "CFDictionary",
    "CFArray",
    "CFNumber",
] }
objc2-audio-toolbox = { version = "0.3", default-features = false, features = [
    "AudioConverter",
    "objc2-core-audio-types",
] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = [
    "CoreAudioBaseTypes",
] }


[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "AudioData",
    "AudioDataInit",
    "AudioSampleFormat",
    "AudioEncoder",
    "AudioEncoderConfig",
    "AudioEncoderInit",
    "AudioEncoderSupport",
    "EncodedAudioChunk",
    "EncodedVideoChunk",
    "EncodedVideoChunkType",
    "EncodedVideoChunkMetadata",
    "VideoDecoderConfig",
    "VideoEncoder",
    "VideoEncoderConfig",
    "VideoEncoderInit",
    "VideoEncoderSupport",
    "VideoFrame",
    "VideoFrameBufferInit",
    "VideoFrameInit",
    "VideoPixelFormat",
    "Window",
    "Navigator",
    # WebGPU — GPUTexture-backed canvas source for `VideoFrame` (Stage 2 GPU path).
    # `web_sys_unstable_apis` is already set for wasm32 in `.cargo/config.toml`.
    "Gpu",
    "GpuAdapter",
    "GpuDevice",
    "GpuQueue",
    "GpuCanvasContext",
    "GpuCanvasConfiguration",
    "GpuCanvasAlphaMode",
    "GpuTextureFormat",
    "GpuTexture",
    "GpuTextureView",
    "GpuCommandEncoder",
    "GpuCommandBuffer",
    "GpuRenderPassEncoder",
    "GpuRenderPassDescriptor",
    "GpuRenderPassColorAttachment",
    "GpuColorDict",
    "GpuLoadOp",
    "GpuStoreOp",
    "OffscreenCanvas",
] }


[features]
default = ["full", "video"]
audio = []
video = []
full = ["audio", "video"]
