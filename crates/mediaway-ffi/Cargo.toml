[package]
name = "mediaway-ffi"
description = "Single C ABI facade over Mediaway container/device/pipeline — merged from the four mediaway-*-ffi crates per ADR-0021"
version.workspace = true
publish = false # no header/ABI has shipped yet — see docs/roadmap.md
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
mediaway-common = { workspace = true }

# Not `workspace = true`: Cargo forbids a member from setting `default-features = false`
# on an inherited dependency whose workspace entry doesn't already say so, so this crate's
# explicit feature pin is spelled out directly (same path/version as the workspace entry).
# Features are propagated from this crate's own `mux`/`demux` (see [features] below)
# rather than hardcoded, so a `demux`-only build doesn't also link `iso-bmff`'s mux path.
mediaway-container = { path = "../mediaway-container", version = "0.1.0", default-features = false }

mediaway-device = { workspace = true }

# `pipeline` module deps — optional so a container/device-only build (`pipeline` feature
# off) doesn't link the encoder/decoder/software-codec graph.
# Needed to match `mp4::Error` variants when converting `PipelineError::Mux` to a
# status code (status.rs) — `mediaway` already pulls this in transitively
# with the same default ("full") features, so this adds no new feature surface.
mediaway-encoder = { workspace = true, optional = true }
# Needed for `VideoDecoder`/`VideoDecoderConfig`/`DecodeError` (pipeline decode C ABI,
# adr/pipeline/0004-auto-decode-c-abi.md) — `mediaway` already pulls this in
# transitively, so this adds no new feature surface.
mediaway-decoder = { workspace = true, optional = true }
mediaway = { workspace = true, optional = true }
# Needed for `mediaway_sw::opus::OpusDecoder` (audio decode C ABI,
# adr/pipeline/0006-audio-decode-c-abi.md) — no `AudioDecoder` trait exists yet to
# reach it through `mediaway-decoder`, so this crate depends on it directly. Default
# features only (no `apm`/`vad`): the Opus module itself is unconditionally compiled.
mediaway-sw = { workspace = true, optional = true }


[dev-dependencies]
mediaway-device = { workspace = true }


[target.'cfg(windows)'.dependencies]


[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_UI_WindowsAndMessaging",
] }


[target.'cfg(target_os = "linux")'.dependencies]


[features]
default = ["mux", "demux", "camera", "desktop", "audio", "hotplug", "pipeline"]
# `audio`+`video` are both required on `mediaway-container` for H.264/AAC sample-entry
# support (verified in iso-bmff/Cargo.toml) regardless of which of mux/demux is on. See
# adr/0001-mp4-mux-demux-c-abi.md §9 for the documented gap this does not fix
# (mediaway-container's other format cores are not feature-gated yet).
mux = ["mediaway-container/mux", "mediaway-container/audio", "mediaway-container/video"]
demux = ["mediaway-container/demux", "mediaway-container/audio", "mediaway-container/video"]
camera = [] # device backends merged into mediaway-device (ADR-0021)
desktop = []
audio = []
hotplug = []
# `pipeline` module: auto encode/decode + Opus audio decode C ABI (adr/pipeline/*).
pipeline = ["dep:mediaway", "dep:mediaway-encoder", "dep:mediaway-decoder", "dep:mediaway-sw"]

[lints]
workspace = true
