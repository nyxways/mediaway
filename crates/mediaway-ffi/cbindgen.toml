# cbindgen config for mediaway-ffi — see docs/adr/0016-cbindgen-ffi-headers.md.
# Generate with: bun tools/scripts/cbindgen-headers.ts generate
# Verify (CI drift gate): bun tools/scripts/cbindgen-headers.ts verify

# "type" (bare typedef name everywhere, e.g. `mediaway_muxer_t *fn(void);`), not
# "both" (which emits `struct mediaway_muxer_t *fn(void);` in signatures) — matches
# every hand-written header's existing style exactly.
language = "C"
style = "type"
# "c99" (`//` line comments), not "doxy" (`/** */` block comments): several Rust doc
# comments in this crate contain markdown bold immediately followed by a slash
# (e.g. "**buffer**/texture handle"), which forms a `**/ ` sequence that would
# prematurely close a C block comment and corrupt everything after it — a real,
# compile-breaking bug found while validating this config, not a hypothetical one.
# Line comments have no multi-line terminator sequence, so this class of bug cannot
# occur with them.
documentation = true
documentation_style = "c99"
include_guard = "MEDIAWAY_FFI_GENERATED_H"
autogen_warning = "/* This file is generated by cbindgen. Do not edit by hand — see cbindgen.toml and tools/scripts/cbindgen-headers.ts. */"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
cpp_compat = true
line_length = 100
tab_width = 2

[defines]
"feature = mux" = "MEDIAWAY_FFI_FEATURE_MUX"
"feature = demux" = "MEDIAWAY_FFI_FEATURE_DEMUX"
"feature = camera" = "MEDIAWAY_FFI_FEATURE_CAMERA"
"feature = desktop" = "MEDIAWAY_FFI_FEATURE_DESKTOP"
"feature = audio" = "MEDIAWAY_FFI_FEATURE_AUDIO"
"feature = hotplug" = "MEDIAWAY_FFI_FEATURE_HOTPLUG"

[export]
item_types = ["enums", "structs", "unions", "typedefs", "opaque", "functions", "constants"]

[export.rename]
# ── common (Rational / pixel / sample / GPU handle / storage kind) ──
# Each of these is defined once in common::types/common::gpu and re-exported as a
# `pub type MediawayX = ...;` alias from container::types/device::types/pipeline::types
# (adr/common/0001-shared-header-consolidation.md). Renaming both the base name and
# every alias name to the SAME target collapses them into one C typedef instead of a
# base type plus a redundant per-module alias typedef.
"Rational" = "mediaway_rational_t"
"MediawayRational" = "mediaway_rational_t"
"PixelFormat" = "mediaway_pixel_format_t"
"MediawayPixelFormat" = "mediaway_pixel_format_t"
"SampleFormat" = "mediaway_sample_format_t"
"MediawaySampleFormat" = "mediaway_sample_format_t"
"GpuDeviceKind" = "mediaway_gpu_device_kind_t"
"MediawayGpuDeviceKind" = "mediaway_gpu_device_kind_t"
"GpuDeviceHandle" = "mediaway_gpu_device_handle_t"
"MediawayGpuDeviceHandle" = "mediaway_gpu_device_handle_t"
"GpuBufferKind" = "mediaway_gpu_buffer_kind_t"
"MediawayGpuBufferKind" = "mediaway_gpu_buffer_kind_t"
"GpuBufferHandle" = "mediaway_gpu_buffer_handle_t"
"MediawayGpuBufferHandle" = "mediaway_gpu_buffer_handle_t"
"VideoFrameStorageKind" = "mediaway_video_frame_storage_kind_t"
"MediawayVideoFrameStorageKind" = "mediaway_video_frame_storage_kind_t"
# `CodecKind` is deliberately NOT collapsed: `MediawayCodecKind` (container) and
# `MediawayPipelineCodecKind` (pipeline) are intentionally distinct C types with
# independent names despite sharing numeric values (adr/pipeline/0001-auto-encode-c-abi.md
# §2) — do not add a "CodecKind" rename here, or both would collapse into one type,
# undoing that decision. The base `CodecKind` enum is left unrenamed in generated
# output as a result — a known, accepted cosmetic redundancy (an extra, unprefixed
# definition alongside the two real ones), not a functional problem: nothing in this
# crate's own code or headers references the bare name.

# ── container ──
"MuxerHandle" = "mediaway_muxer_t"
"DemuxerHandle" = "mediaway_demuxer_t"
"MediawayStatus" = "mediaway_status_t"
"MediawayCodecKind" = "mediaway_codec_kind_t"
"MediawayVideoTrackInfo" = "mediaway_video_track_info_t"
"MediawayAudioTrackInfo" = "mediaway_audio_track_info_t"
"MediawayPacketView" = "mediaway_packet_view_t"
"MediawayPacket" = "mediaway_packet_t"
"MediawayStreamInfo" = "mediaway_stream_info_t"

# ── device ──
"CameraCaptureHandle" = "mediaway_camera_capture_t"
"DesktopCaptureHandle" = "mediaway_desktop_capture_t"
"AudioCaptureHandle" = "mediaway_audio_capture_t"
"DesktopAudioCaptureHandle" = "mediaway_desktop_audio_capture_t"
"HotplugHandle" = "mediaway_device_hotplug_t"
"MediawayDeviceStatus" = "mediaway_device_status_t"
"MediawayCameraCaptureConfig" = "mediaway_camera_capture_config_t"
"MediawayCameraFrame" = "mediaway_camera_frame_t"
"MediawayDesktopCaptureSourceKind" = "mediaway_desktop_capture_source_kind_t"
"MediawayDesktopCaptureConfig" = "mediaway_desktop_capture_config_t"
"MediawayDesktopFrame" = "mediaway_desktop_frame_t"
"MediawayAudioCaptureConfig" = "mediaway_audio_capture_config_t"
"MediawayDeviceAudioFrame" = "mediaway_device_audio_frame_t"
"MediawayDesktopAudioSourceKind" = "mediaway_desktop_audio_source_kind_t"
"MediawayDesktopAudioCaptureConfig" = "mediaway_desktop_audio_capture_config_t"
"MediawayDesktopAudioFrame" = "mediaway_desktop_audio_frame_t"
"MediawayDeviceKind" = "mediaway_device_kind_t"
"MediawayDeviceEventKind" = "mediaway_device_event_kind_t"
"MediawayDeviceEvent" = "mediaway_device_event_t"
"MediawayDeviceHotplugCallbackFn" = "mediaway_device_hotplug_callback_fn"

# ── pipeline ──
"AutoEncoderHandle" = "mediaway_auto_encoder_t"
"EncodeSessionHandle" = "mediaway_encode_session_t"
"AudioEncodeSessionHandle" = "mediaway_audio_encode_session_t"
"MediawayPipelineStatus" = "mediaway_pipeline_status_t"
"MediawayPipelineCodecKind" = "mediaway_pipeline_codec_kind_t"
"MediawayAutoVideoEncodeConfig" = "mediaway_auto_video_encode_config_t"
"MediawayVideoFrame" = "mediaway_video_frame_t"
"MediawayAudioEncodeConfig" = "mediaway_audio_encode_config_t"
"MediawayAudioFrameView" = "mediaway_audio_frame_view_t"
"MediawayAudioPacket" = "mediaway_audio_packet_t"
"MediawayAudioStreamInfo" = "mediaway_audio_stream_info_t"
"DecodeSessionHandle" = "mediaway_decode_session_t"
"MediawayAutoVideoDecodeConfig" = "mediaway_auto_video_decode_config_t"
"MediawayDecodePacketView" = "mediaway_decode_packet_view_t"
"MediawayDecodedVideoFrame" = "mediaway_decoded_video_frame_t"

[fn]
args = "auto"

[struct]
derive_eq = false

# QualifiedScreamingSnakeCase derives the prefix from the enum's original Rust
# PascalCase name (e.g. `MediawayStatus` -> `MEDIAWAY_STATUS_OK`), not the renamed
# C type name (`mediaway_status_t`) — using `prefix_with_name` instead would prefix
# with the renamed name and leak its `_t` suffix into every variant
# (`MEDIAWAY_STATUS_T_OK`), which none of the hand-written headers do.
[enum]
rename_variants = "QualifiedScreamingSnakeCase"
enum_class = false
