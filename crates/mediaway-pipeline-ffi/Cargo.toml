[package]
name = "mediaway-pipeline-ffi"
description = "C ABI facade over mediaway-pipeline (auto video encode -> fragmented MP4) — see docs/spec/c-ffi.md"
version.workspace = true
publish = false # no header/ABI has shipped yet — see docs/roadmap.md
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
mediaway-common = { workspace = true }
mediaway-common-ffi = { path = "../mediaway-common-ffi", version = "0.1.0" }
# Needed to match `mp4::Error` variants when converting `PipelineError::Mux` to a
# status code (status.rs) — `mediaway-pipeline` already pulls this in transitively
# with the same default ("full") features, so this adds no new feature surface.
mediaway-container = { workspace = true }
mediaway-encoder = { workspace = true }
mediaway-pipeline = { workspace = true }

[dev-dependencies]
mediaway-device = { workspace = true }
mediaway-device-desktop = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
# Integration test only: builds its own D3D11 device to share between screen
# capture and the C ABI's GPU write_frame path, and nudges the cursor to keep
# DXGI Desktop Duplication delivering frames on an idle desktop.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
