[package]
name = "mediaway-sw"
description = "Pure Rust sans-io software codec fallbacks (no C codec FFI)"
version.workspace = true
publish = true # hardware-verified — see docs/roadmap.md
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true


[dependencies]
mediaway-common = { workspace = true }
thiserror = { workspace = true }
rav1e = { workspace = true, optional = true }

unsafe-libopus = { workspace = true, optional = true }

sonora = { workspace = true, optional = true }
sonora-agc2 = { workspace = true, optional = true }
sonora-simd = { workspace = true, optional = true }


[lints]
workspace = true


[features]
# Codec families. Defaults keep the pre-split behavior (every codec compiled); a consumer that
# only needs one (e.g. a voice stack: `default-features = false, features = ["opus", "apm", "vad"]`)
# skips the rest — notably `rav1e` (AV1). See adr/0004-codec-feature-split.md.
default = ["av1", "h264", "opus"]
av1 = ["dep:rav1e"]
h264 = []
opus = ["dep:unsafe-libopus"]
apm = ["dep:sonora"]
vad = ["dep:sonora-agc2", "dep:sonora-simd"]
full = ["av1", "h264", "opus", "apm", "vad"]
