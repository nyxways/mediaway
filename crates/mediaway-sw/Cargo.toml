[package]
name = "mediaway-sw"
description = "Pure Rust sans-io software codec fallbacks (no C codec FFI)"
version.workspace = true
publish = true # hardware-verified — see docs/roadmap.md
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true


[dependencies]
mediaway-common = { workspace = true }
thiserror = { workspace = true }
rav1e = { workspace = true }

unsafe-libopus = { workspace = true }

sonora = { workspace = true, optional = true }
sonora-agc2 = { workspace = true, optional = true }
sonora-simd = { workspace = true, optional = true }


[lints]
workspace = true


[features]
default = []
apm = ["dep:sonora"]
vad = ["dep:sonora-agc2", "dep:sonora-simd"]
full = ["apm", "vad"]
