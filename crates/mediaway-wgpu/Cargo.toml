[package]
name = "mediaway-wgpu"
description = "wgpu HAL interop: wgpu::Texture -> Mediaway GpuBufferHandle (GPU framework adapter)"
version.workspace = true
publish = true # hardware-verified — see docs/roadmap.md
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
mediaway-common = { workspace = true }
mediaway-decoder = { workspace = true, features = ["video"] }
mediaway-encoder = { workspace = true, features = ["video"] }
thiserror = { workspace = true }
# Base entry: no backend feature here, so `wgpu::Device`/`wgpu::Texture` types
# (and this crate's off-Windows stub) compile on every target. Platform-gated
# dependency blocks below add the actual backend (`dx12` today).
wgpu = { workspace = true }

[target.'cfg(windows)'.dependencies]
mediaway-decoder-windows = { workspace = true, features = ["video"] }
mediaway-encoder-windows = { workspace = true, features = ["video"] }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
] }
# `wgpu-hal` 26.x pins its OWN `windows`/`windows-core` dependency to the 0.58
# line (incompatible with this workspace's 0.62, per Cargo semver — a COM
# wrapper type from one `windows`-crate version is NOT the same Rust type as
# the "same" wrapper from another version, even though both model the same
# COM interface). This second, explicitly same-versioned `windows` dependency
# (renamed to avoid colliding with the 0.62 one above) exists ONLY to talk to
# `wgpu_hal::dx12`'s API at its exact expected type — never used for anything
# that talks to `mediaway-encoder-windows` (which stays on 0.62). See
# `adr/0001-dx12-hal-gpucopy-bridge.md` § "windows-rs version straddle".
windows-hal-interop = { package = "windows", version = "=0.58.0", default-features = false, features = [
    "Win32_Graphics_Direct3D12",
] }
wgpu = { workspace = true, features = ["dx12", "std"] }

[dev-dependencies]
pollster = { workspace = true }

[lints]
workspace = true
