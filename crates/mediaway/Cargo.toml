[package]
name = "mediaway"
description = "Convenience pipeline layer — composes encoder + container (+ device capture)"
version.workspace = true
publish = true # hardware-verified — see docs/roadmap.md
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true


[dependencies]
mediaway-sw = { workspace = true, features = ["full"] }
mediaway-common = { workspace = true }
mediaway-container = { workspace = true }
mediaway-encoder = { workspace = true }
mediaway-decoder = { workspace = true }
mediaway-device = { workspace = true }
# AEC3 + NS + AGC2 + RNN VAD, wired into EncodeSession's audio path — see
# adr/0003-audio-track-and-apm-integration.md. Unconditional (`full`), matching this
# crate's "batteries included" posture (unlike mediaway-device-ffi's per-feature
# code-exclusion goal, which targets a shipped native binary this crate is not).
smallvec = { workspace = true }
thiserror = { workspace = true }

wgpu = { workspace = true }


[target.'cfg(windows)'.dependencies]

windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
] }
# `wgpu-hal` 26.x pins its OWN `windows`/`windows-core` dependency to the 0.58
# line (incompatible with this workspace's 0.62, per Cargo semver — a COM
# wrapper type from one `windows`-crate version is NOT the same Rust type as
# the "same" wrapper from another version, even though both model the same
# COM interface). This second, explicitly same-versioned `windows` dependency
# (renamed to avoid colliding with the 0.62 one above) exists ONLY to talk to
# `wgpu_hal::dx12`'s API at its exact expected type — never used for anything
# that talks to `mediaway-encoder-windows` (which stays on 0.62). See
# `adr/0001-dx12-hal-gpucopy-bridge.md` § "windows-rs version straddle".
windows-hal-interop = { package = "windows", version = "=0.58.0", default-features = false, features = [
    "Win32_Graphics_Direct3D12",
] }
wgpu = { workspace = true, features = ["dx12", "std"] }


[target.'cfg(target_os = "linux")'.dependencies]


[dev-dependencies]
mediaway-test-media = { workspace = true }

pollster = { workspace = true }


[target.'cfg(windows)'.dev-dependencies]
# Integration test only: builds its own D3D11 device to share between screen
# capture and video encode, and nudges the cursor to keep DXGI Desktop
# Duplication delivering frames on an idle desktop.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_WindowsAndMessaging",
] }


[lints]
workspace = true


[features]
default = []


# `tests/wgpu/*.rs` live under a subdirectory — Cargo's default test-target
# auto-discovery only picks up `.rs` files directly in `tests/`, so these need
# explicit `[[test]]` entries or they silently never get compiled/run (found
# this session: both files below referenced a non-existent `mediaway_wgpu`
# extern crate — a leftover from before the `mediaway-wgpu` crate was merged
# into this one, ADR-0021 — and had therefore never actually been compiled).
[[test]]
name = "dx12_decode_smoke"
path = "tests/wgpu/dx12_decode_smoke.rs"

[[test]]
name = "dx12_encode_smoke"
path = "tests/wgpu/dx12_encode_smoke.rs"

[[test]]
name = "dx12_decode_pixel_roundtrip"
path = "tests/wgpu/dx12_decode_pixel_roundtrip.rs"
