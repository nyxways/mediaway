<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>@mediaway/browser E2E</title>
  </head>
  <body>
    <h1>@mediaway/browser</h1>
    <p id="status">running…</p>
    <script type="module">
      // Exercises the real npm package surface (dist + pkg served from
      // bindings/browser/packages/browser): wasm mux/demux roundtrip, then —
      // when the browser ships usable WebCodecs codecs — H.264 + AAC encode to
      // fMP4 through EncodeSession and decode back through DecodeSession.
      // Results are published to window.mediawayE2e.browserPkg for the
      // Playwright spec.
      import { init, Muxer, Demuxer, EncodeSession, DecodeSession } from "/mediaway-browser/dist/index.js";

      window.mediawayE2e = window.mediawayE2e ?? {};
      const result = {};

      try {
        await init();

        // ── 1. Wasm mux/demux roundtrip (always available) ────────────────
        {
          const muxer = new Muxer(1);
          muxer.addTrack({
            id: 0,
            codec: "h264",
            timeBase: { num: 1, den: 30 },
            width: 64,
            height: 64,
            extraData: new Uint8Array([1, 0x42, 0, 0x1e, 0xff, 0xe1, 0, 4, 0x67, 0x42, 0x00, 0x1e, 1, 0, 4, 0x68, 0xce, 0x06, 0xe2]),
          });
          muxer.addTrack({
            id: 1,
            codec: "aac",
            timeBase: { num: 1, den: 48000 },
            width: 0,
            height: 0,
            extraData: new Uint8Array([0x11, 0x90]),
          });
          muxer.begin();
          for (let i = 0; i < 90; i += 1) {
            muxer.pushPacket({
              streamId: 0,
              pts: i,
              dts: i,
              duration: 1,
              isKeyframe: i % 30 === 0,
              isDiscard: false,
              payload: new Uint8Array([0, 2, 0x65, 0x88]),
            });
          }
          for (let i = 0; i < 90; i += 1) {
            muxer.pushPacket({
              streamId: 1,
              pts: i * 1024,
              dts: i * 1024,
              duration: 1024,
              isKeyframe: true,
              isDiscard: false,
              payload: new Uint8Array([0x21, 0x10, 0x04, 0x60, 0x8c, 0x1c]),
            });
          }
          muxer.flush();
          const bytes = muxer.pollBytes();
          const demuxer = new Demuxer();
          demuxer.pushBytes(bytes);
          let recovered = 0;
          while (demuxer.pollPacket() !== null) recovered += 1;
          const streams = demuxer.streams().map((s) => s.codec);
          demuxer.free();
          muxer.free();
          result.mux = { bytes: bytes.length, recovered, streams };
        }

        // ── 2. WebCodecs H.264 encode -> fMP4 (codec-dependent) ───────────
        try {
          const supported = await VideoEncoder.isConfigSupported({
            codec: "avc1.42E01E",
            width: 64,
            height: 64,
          });
          if (!supported.supported) {
            result.video = { skipped: "avc1.42E01E unsupported" };
            result.decodedVideo = { skipped: "avc1.42E01E unsupported" };
          } else {
            const muxer = new Muxer(1);
            const session = new EncodeSession(muxer);
            const encoder = await session.video({
              codec: "avc1.42E01E",
              width: 64,
              height: 64,
              bitrate: 500_000,
              framerate: 30,
              avc: { format: "avc" },
            });
            const yLen = 64 * 64;
            const data = new Uint8Array(yLen + yLen / 2);
            for (let i = 0; i < 90; i += 1) {
              data.fill(64 + ((i * 7) % 64), 0, yLen);
              const frame = new VideoFrame(data, {
                format: "NV12",
                codedWidth: 64,
                codedHeight: 64,
                timestamp: Math.round((i * 1_000_000) / 30),
              });
              encoder.encode(frame, { keyFrame: i % 30 === 0 });
              frame.close();
            }
            const bytes = await session.finish();
            const demuxer = new Demuxer();
            demuxer.pushBytes(bytes);
            let packets = 0;
            while (demuxer.pollPacket() !== null) packets += 1;
            const codecs = demuxer.streams().map((s) => s.codec);
            demuxer.free();
            muxer.free();
            result.video = { bytes: bytes.length, packets, codecs };

            // ── 2b. DecodeSession round trip on the same H.264 bytes ───────
            try {
              const d = new Demuxer();
              d.pushBytes(bytes);
              const ds = new DecodeSession(d, {
                // The harness encoded avc1.42E01E itself, so it knows the
                // codec string statically — ADR-0022's resolveCodec escape
                // hatch (the container only stores the generic "h264" name).
                resolveCodec: () => "avc1.42E01E",
              });
              let frames = 0;
              let last = null;
              ds.onVideoFrame((frame) => {
                frames += 1;
                // coded* is the bitstream-aligned size (encoders may pad, e.g.
                // 64 -> 66); display* is the visible geometry — assert that.
                last = {
                  width: frame.codedWidth,
                  height: frame.codedHeight,
                  displayWidth: frame.displayWidth,
                  displayHeight: frame.displayHeight,
                };
                frame.close(); // decoder-owned frame — always close it
              });
              await ds.start();
              let demuxed = 0;
              for (;;) {
                const sample = d.pollPacket();
                if (sample === null) break;
                ds.pushPacket(sample);
                demuxed += 1;
              }
              await ds.finish();
              d.free();
              result.decodedVideo = {
                packets: demuxed,
                frames,
                width: last?.width,
                height: last?.height,
                displayWidth: last?.displayWidth,
                displayHeight: last?.displayHeight,
              };
            } catch (err) {
              // Same honest-skip class as the encode section: a decoder that
              // claims support but cannot actually decode here.
              if (err.name === "DecoderUnavailableError" || (err instanceof DOMException && err.name === "OperationError")) {
                result.decodedVideo = { skipped: String(err.message) };
              } else {
                result.decodedVideo = { error: String(err) };
              }
            }
          }
        } catch (err) {
          // Codec claimed support but this Chromium build cannot actually encode
          // (e.g. bundled-Chromium H.264: "OperationError: Encoding error.") —
          // same honest-skip class as an unsupported codec; real codecs run on
          // the msedge-real project.
          if (err.name === "EncoderUnavailableError" || (err instanceof DOMException && err.name === "OperationError")) {
            result.video = { skipped: String(err.message) };
            result.decodedVideo = { skipped: String(err.message) };
          } else {
            result.video = { error: String(err) };
            result.decodedVideo = { error: String(err) };
          }
        }

        // ── 3. WebCodecs AAC encode -> fMP4 (codec-dependent) ─────────────
        try {
          const supported = await AudioEncoder.isConfigSupported({
            codec: "mp4a.40.2",
            sampleRate: 48000,
            numberOfChannels: 1,
          });
          if (!supported.supported) {
            result.audio = { skipped: "mp4a.40.2 unsupported" };
            result.decodedAudio = { skipped: "mp4a.40.2 unsupported" };
          } else {
            const muxer = new Muxer(1);
            const session = new EncodeSession(muxer);
            const encoder = await session.audio({
              codec: "mp4a.40.2",
              sampleRate: 48000,
              numberOfChannels: 1,
              bitrate: 128_000,
            });
            const chunks = 94; // 2 s at 1024-frame chunks / 48 kHz
            for (let c = 0; c < chunks; c += 1) {
              const pcm = new Float32Array(1024);
              for (let s = 0; s < 1024; s += 1) {
                const t = (c * 1024 + s) / 48000;
                pcm[s] = 0.5 * Math.sin(2 * Math.PI * 440 * t);
              }
              const ad = new AudioData({
                format: "f32-planar",
                sampleRate: 48000,
                numberOfFrames: 1024,
                numberOfChannels: 1,
                timestamp: Math.round((c * 1024 * 1_000_000) / 48000),
                data: pcm,
              });
              encoder.encode(ad);
              ad.close();
            }
            const bytes = await session.finish();
            const demuxer = new Demuxer();
            demuxer.pushBytes(bytes);
            let packets = 0;
            while (demuxer.pollPacket() !== null) packets += 1;
            const codecs = demuxer.streams().map((s) => s.codec);
            demuxer.free();
            muxer.free();
            result.audio = { bytes: bytes.length, packets, codecs };

            // ── 3b. DecodeSession round trip on the same AAC bytes ────────
            try {
              const d = new Demuxer();
              d.pushBytes(bytes);
              const ds = new DecodeSession(d, {
                resolveCodec: () => "mp4a.40.2",
              });
              let frames = 0;
              let last = null;
              ds.onAudioData((data) => {
                frames += 1;
                last = {
                  sampleRate: data.sampleRate,
                  numberOfChannels: data.numberOfChannels,
                };
                data.close(); // decoder-owned data — always close it
              });
              await ds.start();
              let demuxed = 0;
              for (;;) {
                const sample = d.pollPacket();
                if (sample === null) break;
                ds.pushPacket(sample);
                demuxed += 1;
              }
              await ds.finish();
              d.free();
              result.decodedAudio = {
                packets: demuxed,
                frames,
                sampleRate: last?.sampleRate,
                numberOfChannels: last?.numberOfChannels,
              };
            } catch (err) {
              // See the video section: OperationError = codec-class skip,
              // not a bug.
              if (err.name === "DecoderUnavailableError" || (err instanceof DOMException && err.name === "OperationError")) {
                result.decodedAudio = { skipped: String(err.message) };
              } else {
                result.decodedAudio = { error: String(err) };
              }
            }
          }
        } catch (err) {
          // See the video section: OperationError = codec-class skip, not a bug.
          if (err.name === "EncoderUnavailableError" || (err instanceof DOMException && err.name === "OperationError")) {
            result.audio = { skipped: String(err.message) };
            result.decodedAudio = { skipped: String(err.message) };
          } else {
            result.audio = { error: String(err) };
            result.decodedAudio = { error: String(err) };
          }
        }

        window.mediawayE2e.browserPkg = result;
        document.getElementById("status").textContent = JSON.stringify(result);
      } catch (err) {
        result.error = String(err);
        window.mediawayE2e.browserPkg = result;
        document.getElementById("status").textContent = "failed: " + String(err);
      }
    </script>
  </body>
</html>
